<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tramvior · TRAMPIL-in Masa Depanmu</title>
<meta name="description" content="Tramvior: aplikasi belajar untuk siswa SMK Solo Raya. Belajar sesuai jurusan, siap kerja, dan dapat kuota.">
<meta name="theme-color" content="#0B2A6F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--navy:#0B2A6F;--blue:#2F6BFF;--blue-d:#1E4FD8;--sky:#E8F0FF;--orange:#FF8A1F;--yellow:#FFC93C;--bg:#F3F6FF;--card:#fff;--ink:#14213D;--muted:#5D6B8C;--line:#E2E8F6;--ok:#12B76A;--ok-bg:#E6F7EF;--bad:#E5484D;--bad-bg:#FDECEC;--shadow:0 1px 2px rgba(11,42,111,.06),0 6px 18px rgba(11,42,111,.06)}
[data-bs-theme=dark]{--bg:#0A1024;--card:#121B36;--ink:#EAF0FF;--muted:#9BA9CE;--line:#212F58;--sky:#1A2850;--ok-bg:#0F2F26;--bad-bg:#3A1A20;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);--bs-body-bg:#0A1024;--bs-body-color:#EAF0FF;--bs-border-color:#212F58}
*{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);font-size:14px;line-height:1.5;margin:0}
h1,h2,h3,h4,h5{font-weight:600;letter-spacing:-.01em;margin:0}
p{margin:0}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:10px}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--bg)}
@media(min-width:520px){body{background:#DCE4F8}[data-bs-theme=dark] body{background:#050915}#app{box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(11,42,111,.2)}}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.ic.sm{width:16px;height:16px}.ic.lg{width:30px;height:30px}
.muted{color:var(--muted)}
small,.small{font-size:12px}

/* ===== splash / onboarding / auth ===== */
.splash{position:fixed;inset:0;max-width:480px;margin:0 auto;background:var(--navy);display:flex;align-items:center;justify-content:center;color:#fff;z-index:50;text-align:center}
.splash h1{font-size:30px;margin-top:14px;font-weight:700}
.splash p{margin-top:4px;color:#FFC93C;font-weight:500}
.splash .sp-in{animation:splashIn .7s ease both}
@keyframes splashIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.onb{min-height:100dvh;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom))}
.onb-skip{align-self:flex-end;background:none;border:0;color:var(--muted);font-weight:500;padding:8px}
.onb-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:0 6px}
.onb-art{width:168px;height:168px;border-radius:44px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;position:relative}
.onb-art .ic{width:74px;height:74px;stroke-width:1.5}
.onb-art::after{content:"";position:absolute;right:-10px;bottom:-10px;width:44px;height:44px;border-radius:50%;background:var(--orange);border:5px solid var(--bg)}
.onb h2{font-size:24px}
.onb p.d{color:var(--muted);max-width:320px}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 18px}
.dots i{width:8px;height:8px;border-radius:8px;background:var(--line);transition:.25s}
.dots i.on{width:26px;background:var(--blue)}
.auth{min-height:100dvh;padding:calc(26px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom))}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.auth-brand h1{font-size:24px;font-weight:700;line-height:1.1}
.auth-brand p{color:var(--orange);font-weight:500;font-size:12.5px}
.seg{display:flex;background:var(--sky);padding:4px;border-radius:14px;margin-bottom:18px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:11px;font-weight:600;color:var(--muted);min-height:44px}
.seg button.on{background:var(--card);color:var(--blue);box-shadow:var(--shadow)}
.form-label{font-weight:500;font-size:13px;margin-bottom:4px}
.form-control,.form-select{border-radius:12px;min-height:46px;background-color:var(--card);border-color:var(--line);color:var(--ink);font-size:14px}
.form-control:focus,.form-select:focus{border-color:var(--blue);box-shadow:0 0 0 .2rem rgba(47,107,255,.18);background-color:var(--card);color:var(--ink)}
.form-control::placeholder{color:var(--muted);opacity:.7}
.form-control.is-invalid,.form-select.is-invalid{border-color:var(--bad);background-image:none}
.err{color:var(--bad);font-size:12px;min-height:0;margin-top:3px}
.err:empty{display:none}
.pw{position:relative}
.pw .form-control{padding-right:48px}
.pw-toggle{position:absolute;right:4px;top:3px;width:40px;height:40px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center}
.form-check-input:checked{background-color:var(--blue);border-color:var(--blue)}

/* ===== buttons, chips, cards ===== */
.btn{border-radius:14px;font-weight:600;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0}
.btn-sm{min-height:38px;padding:6px 14px;font-size:13px;border-radius:12px}
.btn-t{background:var(--blue);color:#fff}.btn-t:hover,.btn-t:active,.btn-t:focus{background:var(--blue-d);color:#fff}
.btn-o{background:var(--orange);color:#1B1200}.btn-o:hover,.btn-o:active,.btn-o:focus{background:#F27A0A;color:#1B1200}
.btn-ghost{background:var(--sky);color:var(--blue)}.btn-ghost:hover,.btn-ghost:active{background:var(--sky);color:var(--blue-d)}
.btn-danger-o{background:var(--bad-bg);color:var(--bad)}
.btn:disabled{opacity:.5}
.card-t{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;background:var(--sky);color:var(--blue);font-size:11.5px;font-weight:600;white-space:nowrap}
.pill .ic{width:13px;height:13px}
.pill-y{background:var(--yellow);color:#3A2A00}.pill-o{background:#FFEBD6;color:#B45500}[data-bs-theme=dark] .pill-o{background:#3A2712;color:#FFB466}
.pill-ok{background:var(--ok-bg);color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;font-weight:600;font-size:13px}
.chip .ic{width:16px;height:16px}
.chip-fire{background:#FFEBD6;color:#C25A00}.chip-pts{background:var(--navy);color:#fff}.chip-pts .ic{color:var(--yellow)}
[data-bs-theme=dark] .chip-fire{background:#3A2712;color:#FFB466}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--sky)}

/* ===== shell ===== */
#topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.tb{display:flex;align-items:center;justify-content:space-between;padding:8px 14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}.dot.off{background:var(--orange)}
.tb-r{display:flex;align-items:center;gap:6px}
#view{padding-bottom:calc(92px + env(safe-area-inset-bottom));min-height:70vh}
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:500;color:var(--muted);padding:2px 0;min-height:52px;justify-content:center}
.tab .ic{width:24px;height:24px;padding:2px 12px;box-sizing:content-box;border-radius:99px;transition:background .2s}
.tab.on{color:var(--blue);font-weight:600}.tab.on .ic{background:var(--sky)}
.netbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:60;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:8px;justify-content:center;text-align:center}
.netbar.off{background:var(--orange);color:#1B1200}.netbar.sync{background:var(--ok);color:#fff}
.netbar.sync .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.view-in{animation:viewIn .28s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.skel{padding:16px}
.skel i{display:block;border-radius:16px;background:linear-gradient(90deg,var(--line) 25%,var(--sky) 37%,var(--line) 63%);background-size:400% 100%;animation:shim 1.2s ease infinite;margin-bottom:12px}
@keyframes shim{0%{background-position:100% 50%}100%{background-position:0 50%}}
.px{padding-left:16px;padding-right:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.sec-h h3{font-size:15px}.sec-h a{font-size:13px;font-weight:500}
.hi{font-size:20px;font-weight:600}
.sub-h{display:flex;align-items:center;gap:6px;padding:8px 10px 4px}
.sub-h h2{font-size:17px}

/* ===== home hero ===== */
.hero{background:var(--navy);color:#fff;border-radius:22px;padding:18px;margin-top:14px;position:relative;overflow:hidden}
.hero .lbl{font-size:12.5px;opacity:.75}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.hero-mid{display:flex;align-items:flex-end;justify-content:space-between;margin-top:4px}
.hero-num{display:flex;align-items:baseline;gap:6px}
.hero-num b{font-size:46px;font-weight:700;line-height:1;letter-spacing:-.03em}
.hero-num span{opacity:.75}
.hero-mb{font-size:13px;opacity:.85;margin-top:2px}
.sig{display:flex;align-items:flex-end;gap:5px;height:58px}
.sig i{width:9px;border-radius:3px;background:rgba(255,255,255,.2);transition:background .4s}
.sig i.on{background:var(--yellow)}
.hero-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink);position:relative;min-height:96px}
.sc .ic-w{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--sky);color:var(--blue)}
.sc b{font-weight:600;font-size:13.5px}
.sc small{color:var(--muted);line-height:1.3}
.sc .lk{position:absolute;right:12px;top:12px;color:var(--muted)}
.qrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qic{width:40px;height:40px;border-radius:13px;background:var(--sky);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.qrow.done .qic{background:var(--ok-bg);color:var(--ok)}
.qrow.lock{opacity:.62}
.qb{flex:1;min-width:0}
.qb b{font-weight:500;font-size:13.5px;display:block}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:9px;transition:width .4s}
.bar.o i{background:var(--orange)}

/* ===== belajar ===== */
.jchips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 6px;scrollbar-width:none}
.jchips::-webkit-scrollbar{display:none}
.jc{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 14px;font-weight:500;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.jc.on{background:var(--navy);border-color:var(--navy);color:#fff}
.jc.locked{opacity:.45;filter:grayscale(.5)}
.kc{display:flex;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:10px;border-left:5px solid var(--jc)}
.kc-ic{width:44px;height:44px;border-radius:14px;background:var(--jc);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.kc h3{font-size:15px}
.kc p{color:var(--muted);font-size:12.5px}
.kc-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.kc-st{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.info{margin-top:10px;background:var(--sky);border-radius:14px;padding:12px}
.info ul{margin:0;padding-left:18px}.info li{font-size:13px;margin:2px 0}

/* ===== video ===== */
.vstage{background:var(--jc);border-radius:20px;color:#fff;min-height:250px;padding:18px 18px 0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.vstage.dk{color:#1B1200}
.vs-scene{flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center;animation:viewIn .35s ease both}
.vs-ic{width:46px;height:46px;stroke-width:1.6}
.vs-scene h3{font-size:20px}
.vs-scene p{font-size:14px;opacity:.95;max-width:34ch}
.vs-n{font-size:12px;opacity:.8}
.vs-bar{position:relative;height:6px;background:rgba(255,255,255,.3);margin:14px -18px 0}
.vs-bar i{position:absolute;left:0;top:0;bottom:0;background:#fff}
.vs-bar b{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--yellow);border:2px solid var(--navy);transform:translateX(-50%)}
.vctl{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.cp h4{font-size:15px;margin:8px 0 12px;line-height:1.4}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:500;min-height:50px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .ol{width:26px;height:26px;border-radius:9px;background:var(--sky);color:var(--blue);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{opacity:1}
.fb{margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:500}
.fb.ok{background:var(--ok-bg);color:var(--ok)}.fb.bad{background:var(--bad-bg);color:var(--bad)}
.pemb{margin-top:10px;background:var(--sky);border-radius:14px;padding:12px;font-size:13px}
.pemb ol{margin:6px 0 0;padding-left:18px}.pemb li{margin:3px 0}
.lockbox{width:100%;margin-top:10px;border:1.5px dashed var(--orange);background:transparent;color:#B45500;border-radius:14px;padding:11px 12px;display:flex;gap:8px;align-items:center;text-align:left;font-weight:500;font-size:13px}
[data-bs-theme=dark] .lockbox{color:#FFB466}
.q{font-size:16px;line-height:1.45;margin-bottom:14px}
.qtop{display:flex;justify-content:space-between;align-items:center;margin:8px 16px 6px;font-size:13px;color:var(--muted)}
.score{font-size:60px;font-weight:700;line-height:1;color:var(--orange)}.score.hi{color:var(--ok)}
.score small{font-size:24px}
.banner{background:var(--yellow);color:#3A2A00;border-radius:14px;padding:10px 12px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;text-align:left}
.banner a{color:#3A2A00;font-weight:600;text-decoration:underline}
.rv{text-align:left;border-top:1px solid var(--line);padding:10px 0;font-size:13px}

/* ===== chat ===== */
.chat{display:flex;flex-direction:column;gap:10px;padding:8px 16px 12px}
.bub{max-width:88%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;font-size:13.5px}
.bub.a{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.bub.u{background:var(--blue);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.bub.s{align-self:center;background:var(--sky);color:var(--muted);font-size:12.5px;text-align:center;max-width:94%}
.bub .who{display:block;font-size:11px;font-weight:600;color:var(--orange);margin-bottom:2px}
.fbk{align-self:flex-start;max-width:92%;border-radius:14px;padding:10px 12px;font-size:12.5px;display:grid;gap:3px}
.fbk.ok{background:var(--ok-bg);color:var(--ok)}.fbk.mid{background:#FFF5D6;color:#8A6100}.fbk.bad{background:var(--bad-bg);color:var(--bad)}
[data-bs-theme=dark] .fbk.mid{background:#3A3010;color:#FFD466}
.fbk i{color:var(--ink);opacity:.85;font-style:normal}
.chat-in{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;gap:8px;padding:8px 16px;background:var(--bg)}
.chat-in .form-control{flex:1}
.chat-in .btn{width:48px;padding:0}
.sugg{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.sugg button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--blue);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:500}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 2px;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* ===== quest & leaderboard ===== */
.streak{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.flame{width:58px;height:58px;border-radius:18px;background:#FFEBD6;color:var(--orange);display:flex;align-items:center;justify-content:center}
[data-bs-theme=dark] .flame{background:#3A2712}
.flame .ic{width:32px;height:32px;stroke-width:1.8;fill:currentColor;fill-opacity:.2}
.flame.on .ic{animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.1) rotate(2deg)}}
.pips{display:flex;gap:5px;margin-top:6px}.pips i{width:20px;height:6px;border-radius:6px;background:var(--line)}.pips i.on{background:var(--orange)}
.rk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rk .n{width:26px;text-align:center;font-weight:700;color:var(--muted)}
.rk.top .n{color:var(--orange)}
.rk.me{background:var(--sky);margin:0 -10px;padding:10px;border-radius:12px;border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none;overflow:hidden;object-fit:cover}
.av.lg{width:72px;height:72px;font-size:24px}

/* ===== kuota / profil ===== */
.pkg{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:16px;padding:12px;background:var(--card);width:100%;text-align:left;color:var(--ink);margin-bottom:8px;min-height:60px}
.pkg.on{border-color:var(--blue);background:var(--sky)}
.pkg:disabled{opacity:.5}
.pkg b{font-size:16px}
.pkg .pp{margin-left:auto;font-weight:600;display:flex;align-items:center;gap:4px}
.pkg .pp .ic{width:15px;height:15px;color:var(--orange)}
.ops{display:flex;gap:8px;margin-bottom:12px}
.ops button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;padding:10px 4px;font-weight:600;font-size:13px;min-height:44px}
.ops button.on{border-color:var(--blue);background:var(--sky);color:var(--blue)}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{text-align:center;padding:12px 6px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.bd .bi{width:46px;height:46px;border-radius:50%;background:var(--yellow);color:#3A2A00;margin:0 auto 6px;display:flex;align-items:center;justify-content:center}
.bd.off{opacity:.5}.bd.off .bi{background:var(--line);color:var(--muted)}
.bd b{font-size:11.5px;font-weight:600;display:block;line-height:1.25}
.set{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--ink);text-align:left}
.set:last-child{border-bottom:0}
.set .ic{color:var(--muted)}
.set span.g{flex:1;font-weight:500}
.set.dng,.set.dng .ic{color:var(--bad)}
.form-switch .form-check-input{width:2.6em;height:1.4em}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat div{background:var(--sky);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:19px}.stat small{color:var(--muted)}

/* ===== passport ===== */
.cert{background:var(--card);border:2px solid var(--navy);border-radius:20px;overflow:hidden;position:relative}
.cert-h{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.cert-h small{opacity:.8;display:block;line-height:1.2}
.cert-b{padding:20px 18px;text-align:center}
.cert-b .nm{font-size:22px;font-weight:700;color:var(--navy);margin:4px 0}
[data-bs-theme=dark] .cert-b .nm{color:#fff}
.cert-b .kp{display:inline-block;background:var(--yellow);color:#3A2A00;padding:5px 14px;border-radius:99px;font-weight:600;margin:8px 0}
.cert-f{border-top:1px dashed var(--line);padding:10px 16px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);flex-wrap:wrap;gap:4px}
.cert.locked .cert-b{filter:blur(5px);user-select:none}
.cert-lock{position:absolute;inset:56px 0 0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;text-align:center;padding:16px}
.cert-lock .btn{box-shadow:var(--shadow)}

/* ===== focus ===== */
.focus-ov{position:fixed;inset:0;z-index:80;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.ring{position:relative;width:230px;height:230px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.15)}.ring .fg{stroke:var(--yellow);transition:stroke-dashoffset 1s linear}
.ring .tm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:46px;font-weight:700}
.ring .tm small{font-size:13px;font-weight:400;opacity:.8}
.durs{display:flex;gap:8px;flex-wrap:wrap}
.durs button{flex:1;min-width:64px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 6px;font-weight:600;min-height:52px}
.durs button.on{border-color:var(--blue);background:var(--sky);color:var(--blue)}
.durs small{display:block;font-weight:400;color:var(--muted);font-size:11px}

/* ===== toast, badge pop, modal ===== */
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 24px));z-index:120;display:grid;gap:8px;pointer-events:none}
.toast-t{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:11px 14px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(-10px);transition:.25s;font-size:13px;font-weight:500}
.toast-t.in{opacity:1;transform:none}
.toast-t.ok .ic{color:var(--yellow)}.toast-t.warn{background:var(--orange);color:#1B1200}
.badge-pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:130;background:var(--card);color:var(--ink);border:2px solid var(--yellow);border-radius:20px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;width:min(340px,calc(100% - 32px))}
.badge-pop small{display:block;color:var(--muted)}
.bp-ic{width:52px;height:52px;border-radius:50%;background:var(--yellow);color:#3A2A00;display:flex;align-items:center;justify-content:center;flex:none}
.bp-ic .ic{width:28px;height:28px}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:140;display:none}
.t-modal{border-radius:22px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.modal{z-index:100}.modal-backdrop{z-index:90}
.modal-dialog{max-width:440px;margin-left:auto;margin-right:auto}
.up-ic{width:64px;height:64px;border-radius:20px;background:var(--yellow);color:#3A2A00;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.up-ic .ic{width:32px;height:32px}
.feat{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.feat li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.feat .ic{color:var(--ok);width:18px;height:18px;margin-top:2px}
.price{text-align:center;margin:10px 0 14px}.price b{font-size:30px;color:var(--navy)}[data-bs-theme=dark] .price b{color:#fff}
.empty{text-align:center;padding:26px 16px;color:var(--muted)}
.empty .ic{width:44px;height:44px;color:var(--line);margin-bottom:6px;stroke-width:1.4}
.empty b{display:block;color:var(--ink);font-weight:600}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function toast(msg,type='info'){

let AC;
function sfx(k){
  if(!SET.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
    const f={ok:[660,880],bad:[240,180],pop:[520,780]}[k]||[600,600],t=AC.currentTime;
    o.frequency.setValueAtTime(f[0],t);o.frequency.setValueAtTime(f[1],t+.1);g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.26)}catch(e){}
}
function confetti(n=80){
  if(RM())return;
  const c=$('#confetti');if(!c||!c.getContext)return;const x=c.getContext('2d');if(!x)return;
  c.width=innerWidth;c.height=innerHeight;c.style.display='block';
  const cols=['#2F6BFF','#FF8A1F','#FFC93C','#0FA5A0','#ffffff'];
  const P=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*11-3,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[rnd(0,4)]}));
  let f=0;(function step(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});
    if(++f<110)requestAnimationFrame(step);else{x.clearRect(0,0,c.width,c.height);c.style.display='none'}})();
}
function countUp(el,to,ms=700){
  if(!el)return;const from=+el.dataset.v||0;el.dataset.v=to;
  if(RM()||from===to){el.textContent=to.toLocaleString('id-ID');return}
  const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/ms);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3))).toLocaleString('id-ID');if(p<1)requestAnimationFrame(f)})(t0);
}

/* ---------- poin, streak, misi, lencana ---------- */
function addPts(a){S.points+=a;S.lifetime+=a;S.weekPoints+=a;if(!navigator.onLine)S.pending++}
function touchStreak(){
  const t=dstr();if(S.lastActive===t)return;
  const y=new Date();y.setDate(y.getDate()-1);
  S.streak=(S.lastActive===dstr(y))?S.streak+1:1;S.lastActive=t;
  if(premium()&&S.streak>1){const b=Math.min(S.streak*5,50);addPts(b);toast(`Bonus streak ${S.streak} hari: +${b} poin`,'ok')}
}
function award(base,why){
  rollover();touchStreak();
  let amt=Math.round(base*(premium()?2:1));
  if(!premium()){
    const left=Math.max(0,FREE_CAP-S.daily.freeEarned);
    if(left<=0){toast('Batas poin harian gratis tercapai. Premium tanpa batas.','warn');save();return 0}
    amt=Math.min(amt,left);S.daily.freeEarned+=amt;
  }
  addPts(amt);save();refreshChips();toast(`+${amt} poin · ${why}`,'ok');checkBadges();return amt;
}

async function hashPw(pw,salt){
  const s=salt+':'+pw;
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

}

function applyReferral(code){
  code=(code||'').trim().toUpperCase();
  if(!code)return{ok:false,msg:'Masukkan kode referral.'};
  if(S.refUsed)return{ok:false,msg:'Kode referral sudah pernah dipakai.'};
  if(code===refCode(U))return{ok:false,msg:'Kode milik sendiri tidak bisa dipakai.'};
  const owner=users().find(u=>refCode(u)===code);
  if(!owner&&code!=='TRAMDEMO')return{ok:false,msg:'Kode tidak ditemukan.'};
  const days=rnd(3,7);
  S.premium.until=Math.max(S.premium.until,Date.now())+days*864e5;S.premium.trial=true;S.refUsed=true;save();
  if(owner){const os=LS.get(stKey(owner.id),null);if(os){os.points+=150;os.lifetime+=150;os.weekPoints+=150;LS.set(stKey(owner.id),os)}}
  renderTop();
  return{ok:true,msg:`Kode diterima! Premium gratis ${days} hari aktif.`};
}

function videoB(id){
  const k=KOMP.find(x=>x.id===id);if(!k)return;
  const N=k.scenes.length,SC=6000,TOTAL=N*SC;
  let t=0,playing=false,waiting=false,tm=null,shown=-1,right=0;const doneCP=new Set();
  const bar=$('#vsBar'),play=$('#vPlay'),time=$('#vTime'),scene=$('#vsScene'),muteBtn=$('#vMute');
  const canSpeak='speechSynthesis' in window;
  let narrationOn=SET.narasi!==false;
  const fm=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+pad(s%60)};
  function speak(text){
    if(!canSpeak||!narrationOn)return;
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='id-ID';u.rate=.95;u.pitch=1;speechSynthesis.speak(u)}catch(e){}
  }
  function stopSpeak(){if(canSpeak)try{speechSynthesis.cancel()}catch(e){}}
  CLEAN=()=>{clearInterval(tm);stopSpeak()};
  if(muteBtn)muteBtn.onclick=()=>{
    narrationOn=!narrationOn;SET.narasi=narrationOn;saveSet();
    muteBtn.innerHTML=ic(narrationOn?'volume':'lock');muteBtn.setAttribute('aria-label',(narrationOn?'Matikan':'Nyalakan')+' narasi suara');
    if(!narrationOn)stopSpeak();else if(shown>-1&&playing)speak(k.scenes[shown][1]);
  };
  function draw(){
    const i=Math.min(N-1,Math.floor(t/SC));
    if(i!==shown){shown=i;const sc=k.scenes[i];scene.style.animation='none';void scene.offsetWidth;scene.style.animation='';
      scene.innerHTML=`${ic(JUR[k.jur].ic,'vs-ic')}<h3>${esc(sc[0])}</h3><p>${esc(sc[1])}</p><span class="vs-n">Bagian ${i+1} dari ${N}</span>`;
      if(playing)speak(sc[0]+'. '+sc[1]);}
    bar.style.width=(t/TOTAL*100)+'%';time.textContent=fm(t)+' / '+fm(TOTAL);
  }
  function setBtn(){play.innerHTML=playing?ic('pause')+' Jeda':ic('play')+(t>0&&t<TOTAL?' Lanjut':' Putar')}
  function resume(){playing=true;clearInterval(tm);tm=setInterval(tick,100);setBtn();if(shown>-1)speak(k.scenes[shown][0]+'. '+k.scenes[shown][1])}
  function tick(){
    t+=100;
    const ix=k.cp.findIndex((c,n)=>!doneCP.has(n)&&t>=(c.after+1)*SC);
    if(ix>-1){t=(k.cp[ix].after+1)*SC;draw();playing=false;waiting=true;clearInterval(tm);setBtn();stopSpeak();showCP(ix);return}
    if(t>=TOTAL){t=TOTAL;draw();playing=false;clearInterval(tm);setBtn();stopSpeak();finish();return}
    draw();
  }
  function showCP(ix){
    const q=mix(k.cp[ix]);
    $('#vCP').innerHTML=`<div class="card-t cp view-in mb-3"><span class="pill pill-o">Jeda pertanyaan ${ix+1} dari ${k.cp.length}</span><h4>${esc(q.q)}</h4><div class="opts">${q.o.map((x,n)=>`<button class="opt" data-i="${n}"><span class="ol">${'ABCD'[n]}</span>${esc(x)}</button>`).join('')}</div><div id="cpFb"></div></div>`;
    sfx('pop');
    $$('#vCP .opt').forEach(b=>b.onclick=()=>{
      const n=+b.dataset.i,good=n===q.a;doneCP.add(ix);
      $$('#vCP .opt').forEach((o,j)=>{o.disabled=true;if(j===q.a&&good)o.classList.add('good');if(j===n&&!good)o.classList.add('bad')});
      let h='';
      if(good){right++;sfx('ok');if(premium())award(5,'Jawaban benar');h=`<div class="fb ok">Jawabanmu benar!${premium()?'':' Poin video khusus Premium.'}</div>`}
      else{sfx('bad');h=`<div class="fb bad">Jawabanmu keliru.</div>`}
      if(premium()&&!good)h+=`<div class="pemb"><b>Pembahasan</b><p>${esc(q.e)}</p></div>`;
      else if(!premium()&&!good)h+=`<button class="lockbox" data-up="Pembahasan jawaban khusus Premium.">${ic('lock')}Lihat pembahasan lengkap dengan Premium</button>`;
      h+=`<button class="btn btn-t w-100 mt-3" id="cpNext">Lanjutkan video</button>`;
      $('#cpFb').innerHTML=h;
      $('#cpNext').onclick=()=>{$('#vCP').innerHTML='';waiting=false;if(t>=TOTAL)finish();else resume()};
    });
  }
  function finish(){
    S.done.video[k.id]=true;save();track('video');const nm=tryMaster(k.id);checkBadges();
    $('#vEnd').innerHTML=`<div class="card-t view-in mb-3"><h4>Video selesai</h4><p class="muted mb-2">${right} dari ${k.cp.length} pertanyaan jeda dijawab benar.</p>
     <div class="info"><b>Rangkuman</b><ul>${k.ringkas.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>
     ${nm?`<div class="banner"><span><b>Kompetensi dikuasai!</b></span><a href="#/passport/${k.id}">Lihat Skill Passport</a></div>`:''}
     <div class="d-grid gap-2 mt-3"><a class="btn btn-t" href="#/soal/santai/${k.id}">Lanjut ke latihan soal</a><button class="btn btn-ghost" id="vAgain">Tonton lagi</button></div></div>`;
    if(right===k.cp.length)confetti(50);
    $('#vAgain').onclick=()=>{t=0;doneCP.clear();right=0;shown=-1;$('#vEnd').innerHTML='';draw();setBtn()};
  }
  play.onclick=()=>{
    if(waiting)return;
    if(t>=TOTAL){t=0;doneCP.clear();right=0;shown=-1;$('#vEnd').innerHTML=''}
    if(playing){playing=false;clearInterval(tm);setBtn();stopSpeak()}else resume();
  };
  draw();setBtn();
}

function soalG(mode,kid){
  rollover();
  if(kid){const k=KOMP.find(x=>x.id===kid);if(!k){go('belajar');return false}if(k.jur!==U.jurusan){lockedJurusanModal(k.jur);go('belajar');return false}}
  if(mode==='ujian'&&!premium()){upgrade('Mode ujian berwaktu untuk simulasi ujian kompetensi keahlian khusus Premium.');go('belajar');return false}
  if(mode!=='ujian'&&!premium()&&S.daily.soal>=FREE_SOAL){upgrade(`Latihan gratis dibatasi ${FREE_SOAL} soal per hari. Coba lagi besok atau buka Premium.`);go('belajar');return false}

function soalH(mode){
  const title=mode==='ujian'?'Mode Ujian':mode==='harian'?'Latihan Harian':'Latihan Soal';
  return `${sub(title,'belajar')}<div class="qtop"><span id="qcount"></span><span id="qtime"></span></div>
   <div class="px"><div class="bar"><i id="qprog" style="width:0"></i></div></div><div class="px mt-3" id="qbox"></div>`;
}
function soalB(mode,kid){
  const pool=KOMP.filter(k=>k.jur===U.jurusan).flatMap(k=>k.soal.map(s=>({...s,kid:k.id})));
  const left=premium()?99:Math.max(0,FREE_SOAL-S.daily.soal);
  let qs;
  if(mode==='ujian')qs=shuffle(pool).slice(0,8);
  else if(kid){const k=KOMP.find(x=>x.id===kid);qs=k?k.soal.map(s=>({...s,kid})).slice(0,left):[]}
  else qs=shuffle(pool).slice(0,Math.min(5,left));
  qs=qs.map(mix);
  const box=$('#qbox');
  if(!qs.length){box.innerHTML=`<div class="empty">${ic('pencil')}<b>Belum ada soal</b>Pilih kompetensi dari menu Belajar.</div>`;return}
  let i=0,ok=0,tid=null,rem=qs.length*30;const rec=[];
  CLEAN=()=>clearInterval(tid);
  if(mode==='ujian'){
    const tt=()=>{$('#qtime').innerHTML=`${ic('clock','sm')} ${Math.floor(rem/60)}:${pad(rem%60)}`};tt();
    tid=setInterval(()=>{rem--;tt();if(rem<=0){clearInterval(tid);toast('Waktu habis','warn');finish()}},1000);
  }
  function showQ(){
    const q=qs[i];
    $('#qprog').style.width=(i/qs.length*100)+'%';$('#qcount').textContent=`Soal ${i+1} dari ${qs.length}`;
    box.innerHTML=`<div class="card-t view-in"><h3 class="q">${esc(q.q)}</h3><div class="opts">${q.o.map((x,n)=>`<button class="opt" data-i="${n}"><span class="ol">${'ABCD'[n]}</span>${esc(x)}</button>`).join('')}</div><div id="fb"></div></div>`;
    $$('.opt',box).forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  }
  function pick(n){
    const q=qs[i],good=n===q.a;rec.push({q,n,good});if(good)ok++;
    if(mode==='ujian'){next();return}
    $$('.opt',box).forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('good');if(j===n&&!good)b.classList.add('bad')});
    S.daily.soal++;if(good)S.correct++;
    if(good){award(2,'Jawaban benar');sfx('ok')}else sfx('bad');
    track('soal');save();
    let h=`<div class="fb ${good?'ok':'bad'}">${good?'Benar!':'Kurang tepat. Jawaban yang benar: '+esc(q.o[q.a])}</div>`;
    h+=premium()?`<div class="pemb"><b>Cara mengerjakan</b><ol>${q.e.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`
      :`<button class="lockbox" data-up="Pembahasan langkah demi langkah khusus Premium.">${ic('lock')}Pembahasan langkah demi langkah ada di Premium</button>`;
    h+=`<button class="btn btn-t w-100 mt-3" id="nx">${i+1<qs.length?'Soal berikutnya':'Lihat hasil'}</button>`;
    $('#fb').innerHTML=h;$('#nx').onclick=next;
  }
  function next(){i++;if(i<qs.length)showQ();else finish()}
  function finish(){
    clearInterval(tid);
    const n=qs.length,pct=Math.round(ok/n*100);$('#qprog').style.width='100%';
    let extra='',rv='';
    if(mode==='ujian'){
      S.correct+=ok;S.daily.soal+=rec.length;track('soal',rec.length);
      award(10+Math.round(pct*.4),'Ujian selesai');S.examBest=Math.max(S.examBest,pct);save();
      rv=rec.map((r,x)=>`<div class="rv"><b>${x+1}. ${esc(r.q.q)}</b><br>${r.good?'<span style="color:var(--ok)">Benar</span>':`<span style="color:var(--bad)">Salah</span>. Jawaban benar: ${esc(r.q.o[r.q.a])}`}<ol class="mb-0 mt-1 muted">${r.q.e.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`).join('');
    }else if(kid&&pct>=70){
      S.done.latihan[kid]=Math.max(S.done.latihan[kid]||0,pct);save();
      if(tryMaster(kid))extra=`<div class="banner"><span><b>Kompetensi dikuasai!</b></span><a href="#/passport/${kid}">Lihat Skill Passport</a></div>`;
    }
    const msg=pct>=70?'Kerja bagus! Pertahankan.':kid?'Nilai minimal 70% untuk menguasai kompetensi. Coba lagi ya.':'Terus berlatih, kamu pasti bisa.';
    box.innerHTML=`<div class="card-t text-center view-in"><div class="score ${pct>=70?'hi':''}">${pct}<small>%</small></div><p class="mt-1">${ok} dari ${n} soal benar</p><p class="muted small">${msg}</p>${extra}${mode==='ujian'?`<p class="small muted mt-2">Skor ujian terbaikmu: ${S.examBest}%</p><div class="mt-3">${rv}</div>`:''}
     <div class="d-grid gap-2 mt-3"><button class="btn btn-t" id="again">Ulangi</button><a class="btn btn-ghost" href="#/belajar">Kembali ke Belajar</a></div></div>`;
    $('#again').onclick=()=>render();
    if(pct>=70)confetti(50);
  }
  showQ();
}

function tutorAnswer(q){

  t+=premium()?(jw?'\n\nYen isih bingung, takon meneh wae ya.':'\n\nKalau masih bingung, tanya lagi ya.'):'';

      else fbk('bad','Coba lagi dengan lebih lengkap.',`Contoh: "${turn.ex}"`);
      i++;busy=false;setTimeout(nextTurn,500);
    },500);
  };
  function finish(){
    const pct=Math.round(scoreSum/(s.turns.length*3)*100);
    S.done.video['sim_'+s.id]=true;S.simDone++;track('sim');save();checkBadges();
    award(6+Math.round(pct*.2),'Sesi Dunia Kerja selesai');
    $('#simForm').style.display='none';$('#simHint').style.display='none';
    $('#simEnd').innerHTML=`<div class="card-t text-center view-in mt-2"><div class="score ${pct>=60?'hi':''}">${pct}<small>%</small></div><p class="muted small mt-1">Evaluasi AI untuk sesi ${esc(s.judul)}</p>

    if(pct>=60)confetti(50);
    $('#simAgain').onclick=()=>render();
  }
}

function runFocus(mins){
  const total=mins*60,R=2*Math.PI*100;
  const ov=document.createElement('div');ov.className='focus-ov';
  ov.innerHTML=`<p class="muted" style="color:#B9C6EE">${ic('lock','sm')} Aplikasi lain terkunci (simulasi)</p>
   <div class="ring"><svg viewBox="0 0 220 220"><circle class="bg" cx="110" cy="110" r="100"/><circle class="fg" id="fRing" cx="110" cy="110" r="100" stroke-dasharray="${R}" stroke-dashoffset="0"/></svg><div class="tm"><span id="fT">${mins}:00</span><small>tersisa</small></div></div>
   <p id="fPts">+0 poin bonus</p>
   <button class="btn btn-ghost" id="fStop">Hentikan sesi</button>`;
  document.body.appendChild(ov);
  let left=total,earned=0,lastMin=0;
  const tid=setInterval(()=>{
    left--;const p=1-left/total;$('#fRing').style.strokeDashoffset=R*(1-p);
    $('#fT').textContent=Math.floor(left/60)+':'+pad(left%60);
    const mDone=Math.floor((total-left)/60);
    if(mDone>lastMin){lastMin=mDone;S.focusMin++;earned+=Math.round(6*(premium()?2:1));$('#fPts').textContent='+'+earned+' poin bonus';track('fokus');save();checkBadges()}
    if(left<=0){clearInterval(tid);end(true)}
  },1000);
  function end(complete){
    ov.remove();
    if(earned>0){addPts(earned);save();refreshChips();toast(`Sesi fokus selesai: +${earned} poin`,'ok');confetti(40)}
    else toast('Sesi fokus dihentikan','warn');
    render();
  }
  $('#fStop').onclick=()=>{clearInterval(tid);end(false)};
}

    return `${sub('Skill Passport','profil')}<div class="px">${ids.length?ids.map(i=>{const k=KOMP.find(x=>x.id===i);return k?`<a class="kc" style="--jc:${JUR[k.jur].c};color:var(--ink)" href="#/passport/${i}"><div class="kc-ic">${ic('award')}</div><div class="kc-b"><h3>${esc(k.judul)}</h3><p>${esc(k.jur)} · ${S.passports[i]?'Diterbitkan':'Siap diterbitkan'}</p></div></a>`:''}).join(''):`<div class="empty">${ic('award')}<b>Belum ada kompetensi dikuasai</b>Selesaikan video dan latihan soal (nilai ≥70%) untuk membuka Skill Passport.</div>`}</div>`;
  }
  const k=KOMP.find(x=>x.id===id);if(!k){go('passport');return''}
  const p=S.passports[id],locked=!premium();
  return `${sub('Skill Passport','passport')}<div class="px">
   <div class="cert ${locked?'locked':''}">
    <div class="cert-h">${ic('award')}<div><b>Tramvior Skill Passport</b><small>Sertifikat kompetensi terverifikasi</small></div></div>
    <div class="cert-b"><small class="muted">Kompetensi</small><div class="nm">${esc(k.judul)}</div><span class="kp">${esc(k.jur)}</span><p class="small muted mt-2">Diberikan kepada</p><b>${esc(U.nama)}</b><p class="small muted">${esc(U.sekolah)} · Kelas ${esc(U.kelas)}</p></div>
    <div class="cert-f"><span>Kode: ${p?p.code:'—'}</span><span>${p?fmtDate(p.date):'Belum diterbitkan'}</span></div>
    ${locked?`<div class="cert-lock"><p class="small mb-0">Terbitkan dan bagikan Skill Passport dengan Premium</p><button class="btn btn-o btn-sm" data-up="Skill Passport khusus Premium.">${ic('crown','sm')}Buka Premium</button></div>`:''}
   </div>
   ${!locked?`<div class="d-grid gap-2 mt-3">${p?`<button class="btn btn-ghost" id="shareP">${ic('share','sm')} Bagikan</button>`:`<button class="btn btn-t" id="issueP">${ic('award','sm')} Terbitkan Skill Passport</button>`}</div>`:''}
   <p class="small muted mt-3">Skill Passport berfungsi sebagai portofolio mandiri yang bisa dilampirkan saat melamar kerja lewat LinkedIn, WhatsApp, atau email.</p>
  </div>`;
}
function passB(id){
  if(!id)return;
  const ip=$('#issueP');if(ip)ip.onclick=()=>{issuePassport(id);toast('Skill Passport diterbitkan','ok');render()};
  const sp=$('#shareP');if(sp)sp.onclick=()=>{const p=S.passports[id],k=KOMP.find(x=>x.id===id);const text=`Saya baru saja menguasai kompetensi "${k.judul}" (${k.jur}) di Tramvior. Kode Skill Passport: ${p.code}.`;
    if(navigator.share)navigator.share({title:'Tramvior Skill Passport',text}).catch(()=>{});
    else{navigator.clipboard?.writeText(text);toast('Teks Skill Passport disalin','ok')}};
}

/* =====================================================
   ONBOARDING
   ===================================================== */
function showOnboard(){
  showSec('onboard');let i=0;
  const paint=()=>{
    const s=ONB[i];
    $('#onboard').innerHTML=`<div class="onb">
     <button class="onb-skip" id="obSkip">Lewati</button>
     <div class="onb-body"><div class="onb-art">${ic(s.ic)}</div><h2>${esc(s.t)}</h2><p class="d">${esc(s.d)}</p></div>
     <div class="dots">${ONB.map((_,n)=>`<i class="${n===i?'on':''}"></i>`).join('')}</div>
     <button class="btn btn-t w-100" id="obNext">${i<ONB.length-1?'Lanjut':'Mulai'}</button></div>`;
    $('#obSkip').onclick=finish;$('#obNext').onclick=()=>{i++;i<ONB.length?paint():finish()};
  };
  function finish(){LS.set('tv_onb',1);showAuth('login')}
  paint();
}

/* =====================================================
   BOOT
   ===================================================== */
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=$('#btnInstall');if(b)b.hidden=false});
window.addEventListener('appinstalled',()=>{deferredPrompt=null});

async function boot(){
  applyTheme();bindNet();
  if('serviceWorker' in navigator){
    try{await navigator.serviceWorker.register('sw.js');SWREADY=true}catch(e){SWREADY=false}
  }
  const seen=LS.get('tv_onb',0);
  const uid=getSession();
  const doStart=()=>{
    if(uid){const u=users().find(x=>x.id===uid);if(u){startSession(u,!!localStorage.getItem('tv_session'));return}}
    seen?showAuth('login'):showOnboard();
  };
  if(RM())doStart();else setTimeout(doStart,900);
}
document.addEventListener('DOMContentLoaded',boot);
