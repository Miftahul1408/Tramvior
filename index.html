<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tramvior · TRAMPIL-in Masa Depanmu</title>
<meta name="description" content="Tramvior: aplikasi belajar untuk siswa SMK Solo Raya. Belajar sesuai jurusan, siap kerja, dan dapat kuota.">
<meta name="theme-color" content="#0B2A6F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/logotramvior192.png" type="image/png">
<link rel="apple-touch-icon" href="img/logotramvior192.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--navy:#0B2A6F;--blue:#2F6BFF;--blue-d:#1E4FD8;--sky:#E8F0FF;--orange:#FF8A1F;--yellow:#FFC93C;--bg:#F3F6FF;--card:#fff;--ink:#14213D;--muted:#5D6B8C;--line:#E2E8F6;--ok:#12B76A;--ok-bg:#E6F7EF;--bad:#E5484D;--bad-bg:#FDECEC;--shadow:0 1px 2px rgba(11,42,111,.06),0 6px 18px rgba(11,42,111,.06)}
[data-bs-theme=dark]{--bg:#0A1024;--card:#121B36;--ink:#EAF0FF;--muted:#9BA9CE;--line:#212F58;--sky:#1A2850;--ok-bg:#0F2F26;--bad-bg:#3A1A20;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);--bs-body-bg:#0A1024;--bs-body-color:#EAF0FF;--bs-border-color:#212F58}
*{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);font-size:14px;line-height:1.5;margin:0}
h1,h2,h3,h4,h5{font-weight:600;letter-spacing:-.01em;margin:0}
p{margin:0}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:10px}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--bg)}
@media(min-width:520px){body{background:#DCE4F8}[data-bs-theme=dark] body{background:#050915}#app{box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(11,42,111,.2)}}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.ic.sm{width:16px;height:16px}.ic.lg{width:30px;height:30px}
.muted{color:var(--muted)}
small,.small{font-size:12px}
.splash{
  position:fixed;
  inset:0;
  max-width:480px;
  margin:0 auto;
  background:var(--navy);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  z-index:50;
  text-align:center;
}

.splash h1{
  font-size:30px;
  margin-top:14px;
  font-weight:700;
}

.splash p{
  margin-top:4px;
  color:#FFC93C;
  font-weight:500;
}

.splash .sp-in{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  width:100%;
  margin:0;
  animation:splashIn .7s ease both;
}
@keyframes splashIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.onb{min-height:100dvh;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom))}
.onb-skip{align-self:flex-end;background:none;border:0;color:var(--muted);font-weight:500;padding:8px}
.onb-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:0 6px}
.onb-art{width:200px;height:200px;display:flex;align-items:center;justify-content:center;position:relative}
.onb-art img{width:100%;height:100%;object-fit:contain;display:block}
.onb h2{font-size:24px}
.onb p.d{color:var(--muted);max-width:320px}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 18px}
.dots i{width:8px;height:8px;border-radius:8px;background:var(--line);transition:.25s}
.dots i.on{width:26px;background:var(--blue)}
.auth{min-height:100dvh;padding:calc(26px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom))}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.auth-brand h1{font-size:24px;font-weight:700;line-height:1.1}
.auth-brand p{color:var(--orange);font-weight:500;font-size:12.5px}
.seg{display:flex;background:var(--sky);padding:4px;border-radius:14px;margin-bottom:18px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:11px;font-weight:600;color:var(--muted);min-height:44px}
.seg button.on{background:var(--card);color:var(--blue);box-shadow:var(--shadow)}
.form-label{font-weight:500;font-size:13px;margin-bottom:4px}
.form-control,.form-select{border-radius:12px;min-height:46px;background-color:var(--card);border-color:var(--line);color:var(--ink);font-size:14px}
.form-control:focus,.form-select:focus{border-color:var(--blue);box-shadow:0 0 0 .2rem rgba(47,107,255,.18);background-color:var(--card);color:var(--ink)}
.form-control::placeholder{color:var(--muted);opacity:.7}
.form-control.is-invalid,.form-select.is-invalid{border-color:var(--bad);background-image:none}
.err{color:var(--bad);font-size:12px;min-height:0;margin-top:3px}
.err:empty{display:none}
.pw{position:relative}
.pw .form-control{padding-right:48px}
.pw-toggle{position:absolute;right:4px;top:3px;width:40px;height:40px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center}
.form-check-input:checked{background-color:var(--blue);border-color:var(--blue)}
.btn{border-radius:14px;font-weight:600;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0}
.btn-sm{min-height:38px;padding:6px 14px;font-size:13px;border-radius:12px}
.btn-t{background:var(--blue);color:#fff}.btn-t:hover,.btn-t:active,.btn-t:focus{background:var(--blue-d);color:#fff}
.btn-o{background:var(--orange);color:#1B1200}.btn-o:hover,.btn-o:active,.btn-o:focus{background:#F27A0A;color:#1B1200}
.btn-ghost{background:var(--sky);color:var(--blue)}.btn-ghost:hover,.btn-ghost:active{background:var(--sky);color:var(--blue-d)}
.btn-danger-o{background:var(--bad-bg);color:var(--bad)}
.btn:disabled{opacity:.5}
.card-t{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;background:var(--sky);color:var(--blue);font-size:11.5px;font-weight:600;white-space:nowrap}
.pill .ic{width:13px;height:13px}
.pill-y{background:var(--yellow);color:#3A2A00}.pill-o{background:#FFEBD6;color:#B45500}[data-bs-theme=dark] .pill-o{background:#3A2712;color:#FFB466}
.pill-ok{background:var(--ok-bg);color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;font-weight:600;font-size:13px}
.chip .ic{width:16px;height:16px}
.chip-fire{background:#FFEBD6;color:#C25A00}.chip-pts{background:var(--navy);color:#fff}.chip-pts .ic{color:var(--yellow)}
[data-bs-theme=dark] .chip-fire{background:#3A2712;color:#FFB466}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--sky)}
#topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.tb{display:flex;align-items:center;justify-content:space-between;padding:8px 14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}.dot.off{background:var(--orange)}
.tb-r{display:flex;align-items:center;gap:6px}
#view{padding-bottom:calc(92px + env(safe-area-inset-bottom));min-height:70vh}
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:500;color:var(--muted);padding:2px 0;min-height:52px;justify-content:center}
.tab .ic{width:24px;height:24px;padding:2px 12px;box-sizing:content-box;border-radius:99px;transition:background .2s}
.tab.on{color:var(--blue);font-weight:600}.tab.on .ic{background:var(--sky)}
.netbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:60;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:8px;justify-content:center;text-align:center}
.netbar.off{background:var(--orange);color:#1B1200}.netbar.sync{background:var(--ok);color:#fff}
.netbar.sync .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.view-in{animation:viewIn .28s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.skel{padding:16px}
.skel i{display:block;border-radius:16px;background:linear-gradient(90deg,var(--line) 25%,var(--sky) 37%,var(--line) 63%);background-size:400% 100%;animation:shim 1.2s ease infinite;margin-bottom:12px}
@keyframes shim{0%{background-position:100% 50%}100%{background-position:0 50%}}
.px{padding-left:16px;padding-right:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.sec-h h3{font-size:15px}.sec-h a{font-size:13px;font-weight:500}
.hi{font-size:20px;font-weight:600}
.sub-h{display:flex;align-items:center;gap:6px;padding:8px 10px 4px}
.sub-h h2{font-size:17px}
.hero{background:var(--navy);color:#fff;border-radius:22px;padding:18px;margin-top:14px;position:relative;overflow:hidden}
.hero .lbl{font-size:12.5px;opacity:.75}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.hero-mid{display:flex;align-items:flex-end;justify-content:space-between;margin-top:4px}
.hero-num{display:flex;align-items:baseline;gap:6px}
.hero-num b{font-size:46px;font-weight:700;line-height:1;letter-spacing:-.03em}
.hero-num span{opacity:.75}
.hero-mb{font-size:13px;opacity:.85;margin-top:2px}
.sig{display:flex;align-items:flex-end;gap:5px;height:58px}
.sig i{width:9px;border-radius:3px;background:rgba(255,255,255,.2);transition:background .4s}
.sig i.on{background:var(--yellow)}
.hero-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink);position:relative;min-height:96px}
.sc .ic-w{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--sky);color:var(--blue)}
.sc b{font-weight:600;font-size:13.5px}
.sc small{color:var(--muted);line-height:1.3}
.sc .lk{position:absolute;right:12px;top:12px;color:var(--muted)}
.qrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qic{width:40px;height:40px;border-radius:13px;background:var(--sky);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.qrow.done .qic{background:var(--ok-bg);color:var(--ok)}
.qrow.lock{opacity:.62}
.qb{flex:1;min-width:0}
.qb b{font-weight:500;font-size:13.5px;display:block}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:9px;transition:width .4s}
.bar.o i{background:var(--orange)}
.jchips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 6px;scrollbar-width:none}
.jchips::-webkit-scrollbar{display:none}
.jc{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 14px;font-weight:500;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.jc.on{background:var(--navy);border-color:var(--navy);color:#fff}
.jc.locked{opacity:.45;filter:grayscale(.5)}
.kc{display:flex;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:10px;border-left:5px solid var(--jc)}
.kc-ic{width:44px;height:44px;border-radius:14px;background:var(--jc);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.kc h3{font-size:15px}
.kc p{color:var(--muted);font-size:12.5px}
.kc-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.kc-st{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.info{margin-top:10px;background:var(--sky);border-radius:14px;padding:12px}
.info ul{margin:0;padding-left:18px}.info li{font-size:13px;margin:2px 0}
.vstage{background:var(--jc);border-radius:20px;color:#fff;overflow:hidden;position:relative}
.vstage.dk{color:#1B1200}
.yt-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:20px 20px 0 0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.yt-wrap iframe,.yt-wrap #ytPlayer{position:absolute;inset:0;width:100%;height:100%;border:0}
.vctl{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.vctl .btn{flex:1;min-width:0}
.vmeta{padding:12px 16px}
.vmeta h3{font-size:16px}
.vmeta p{color:var(--muted);font-size:12.5px;margin-top:2px}
.cp h4{font-size:15px;margin:8px 0 12px;line-height:1.4}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:500;min-height:50px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .ol{width:26px;height:26px;border-radius:9px;background:var(--sky);color:var(--blue);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{opacity:1}
.fb{margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:500}
.fb.ok{background:var(--ok-bg);color:var(--ok)}.fb.bad{background:var(--bad-bg);color:var(--bad)}
.pemb{margin-top:10px;background:var(--sky);border-radius:14px;padding:12px;font-size:13px}
.pemb ol{margin:6px 0 0;padding-left:18px}.pemb li{margin:3px 0}
.lockbox{width:100%;margin-top:10px;border:1.5px dashed var(--orange);background:transparent;color:#B45500;border-radius:14px;padding:11px 12px;display:flex;gap:8px;align-items:center;text-align:left;font-weight:500;font-size:13px}
[data-bs-theme=dark] .lockbox{color:#FFB466}
.q{font-size:16px;line-height:1.45;margin-bottom:14px}
.qtop{display:flex;justify-content:space-between;align-items:center;margin:8px 16px 6px;font-size:13px;color:var(--muted)}
.score{font-size:60px;font-weight:700;line-height:1;color:var(--orange)}.score.hi{color:var(--ok)}
.score small{font-size:24px}
.banner{background:var(--yellow);color:#3A2A00;border-radius:14px;padding:10px 12px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;text-align:left}
.banner a{color:#3A2A00;font-weight:600;text-decoration:underline}
.rv{text-align:left;border-top:1px solid var(--line);padding:10px 0;font-size:13px}
.chat{display:flex;flex-direction:column;gap:10px;padding:8px 16px 12px}
.bub{max-width:88%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;font-size:13.5px}
.bub.a{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.bub.u{background:var(--blue);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.bub.s{align-self:center;background:var(--sky);color:var(--muted);font-size:12.5px;text-align:center;max-width:94%}
.bub .who{display:block;font-size:11px;font-weight:600;color:var(--orange);margin-bottom:2px}
.fbk{align-self:flex-start;max-width:92%;border-radius:14px;padding:10px 12px;font-size:12.5px;display:grid;gap:3px}
.fbk.ok{background:var(--ok-bg);color:var(--ok)}.fbk.mid{background:#FFF5D6;color:#8A6100}.fbk.bad{background:var(--bad-bg);color:var(--bad)}
[data-bs-theme=dark] .fbk.mid{background:#3A3010;color:#FFD466}
.fbk i{color:var(--ink);opacity:.85;font-style:normal}
.chat-in{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;gap:8px;padding:8px 16px;background:var(--bg)}
.chat-in .form-control{flex:1}
.chat-in .btn{width:48px;padding:0}
.sugg{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.sugg button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--blue);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:500}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 2px;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.streak{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.flame{width:58px;height:58px;border-radius:18px;background:#FFEBD6;color:var(--orange);display:flex;align-items:center;justify-content:center}
[data-bs-theme=dark] .flame{background:#3A2712}
.flame .ic{width:32px;height:32px;stroke-width:1.8;fill:currentColor;fill-opacity:.2}
.flame.on .ic{animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.1) rotate(2deg)}}
.pips{display:flex;gap:5px;margin-top:6px}.pips i{width:20px;height:6px;border-radius:6px;background:var(--line)}.pips i.on{background:var(--orange)}
.rk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rk .n{width:26px;text-align:center;font-weight:700;color:var(--muted)}
.rk.top .n{color:var(--orange)}
.rk.me{background:var(--sky);margin:0 -10px;padding:10px;border-radius:12px;border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none;overflow:hidden;object-fit:cover}
.av.lg{width:72px;height:72px;font-size:24px}
.pkg{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:16px;padding:12px;background:var(--card);width:100%;text-align:left;color:var(--ink);margin-bottom:8px;min-height:60px}
.pkg.on{border-color:var(--blue);background:var(--sky)}
.pkg:disabled{opacity:.5}
.pkg b{font-size:16px}
.pkg .pp{margin-left:auto;font-weight:600;display:flex;align-items:center;gap:4px}
.pkg .pp .ic{width:15px;height:15px;color:var(--orange)}
.ops{display:flex;gap:8px;margin-bottom:12px}
.ops button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;padding:10px 4px;font-weight:600;font-size:13px;min-height:44px}
.ops button.on{border-color:var(--blue);background:var(--sky);color:var(--blue)}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{text-align:center;padding:12px 6px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.bd .bi{width:46px;height:46px;border-radius:50%;background:var(--yellow);color:#3A2A00;margin:0 auto 6px;display:flex;align-items:center;justify-content:center}
.bd.off{opacity:.5}.bd.off .bi{background:var(--line);color:var(--muted)}
.bd b{font-size:11.5px;font-weight:600;display:block;line-height:1.25}
.set{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--ink);text-align:left}
.set:last-child{border-bottom:0}
.set .ic{color:var(--muted)}
.set span.g{flex:1;font-weight:500}
.set.dng,.set.dng .ic{color:var(--bad)}
.form-switch .form-check-input{width:2.6em;height:1.4em}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat div{background:var(--sky);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:19px}.stat small{color:var(--muted)}
.cert{background:var(--card);border:2px solid var(--navy);border-radius:20px;overflow:hidden;position:relative}
.cert-h{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.cert-h small{opacity:.8;display:block;line-height:1.2}
.cert-b{padding:20px 18px;text-align:center}
.cert-b .nm{font-size:22px;font-weight:700;color:var(--navy);margin:4px 0}
[data-bs-theme=dark] .cert-b .nm{color:#fff}
.cert-b .kp{display:inline-block;background:var(--yellow);color:#3A2A00;padding:5px 14px;border-radius:99px;font-weight:600;margin:8px 0}
.cert-f{border-top:1px dashed var(--line);padding:10px 16px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);flex-wrap:wrap;gap:4px}
.cert.locked .cert-b{filter:blur(5px);user-select:none}
.cert-lock{position:absolute;inset:56px 0 0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;text-align:center;padding:16px}
.cert-lock .btn{box-shadow:var(--shadow)}
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 24px));z-index:120;display:grid;gap:8px;pointer-events:none}
.toast-t{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:11px 14px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(-10px);transition:.25s;font-size:13px;font-weight:500}
.toast-t.in{opacity:1;transform:none}
.toast-t.ok .ic{color:var(--yellow)}.toast-t.warn{background:var(--orange);color:#1B1200}
.badge-pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:130;background:var(--card);color:var(--ink);border:2px solid var(--yellow);border-radius:20px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;width:min(340px,calc(100% - 32px))}
.badge-pop small{display:block;color:var(--muted)}
.bp-ic{width:52px;height:52px;border-radius:50%;background:var(--yellow);color:#3A2A00;display:flex;align-items:center;justify-content:center;flex:none}
.bp-ic .ic{width:28px;height:28px}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:140;display:none}
.t-modal{border-radius:22px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.modal{z-index:100}.modal-backdrop{z-index:90}
.modal-dialog{max-width:440px;margin-left:auto;margin-right:auto}
.up-ic{width:64px;height:64px;border-radius:20px;background:var(--yellow);color:#3A2A00;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.up-ic .ic{width:32px;height:32px}
.feat{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.feat li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.feat .ic{color:var(--ok);width:18px;height:18px;margin-top:2px}
.price{text-align:center;margin:10px 0 14px}.price b{font-size:30px;color:var(--navy)}[data-bs-theme=dark] .price b{color:#fff}
.empty{text-align:center;padding:26px 16px;color:var(--muted)}
.empty .ic{width:44px;height:44px;color:var(--line);margin-bottom:6px;stroke-width:1.4}
.empty b{display:block;color:var(--ink);font-weight:600}
.seg2{display:flex;background:var(--sky);padding:4px;border-radius:14px;margin-bottom:14px}
.seg2 button{flex:1;border:0;background:none;padding:9px;border-radius:11px;font-weight:600;color:var(--muted);min-height:40px;font-size:13px}
.seg2 button.on{background:var(--card);color:var(--blue);box-shadow:var(--shadow)}
/* Skill Passport */
.passport-card{background:#fff;color:#14213D;border:2px solid var(--navy);border-radius:20px;overflow:hidden}
.passport-inner{padding:18px 16px;text-align:center}
.passport-brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;text-align:left}
.passport-brand-left{display:flex;align-items:center;gap:10px}
.passport-logo{width:40px;height:40px;object-fit:contain}
.passport-brand-name{font-weight:700;color:#0B2A6F;letter-spacing:.04em}
.passport-brand-sub{display:block;font-size:10.5px;color:#FF8A1F;font-weight:500}
.passport-badge{width:40px;height:40px;border-radius:50%;background:#FFC93C;color:#3A2A00;display:flex;align-items:center;justify-content:center}
.passport-title{font-size:20px;font-weight:700;color:#0B2A6F;letter-spacing:.08em}
.passport-subtitle{font-size:12px;color:#5D6B8C;margin-bottom:14px}
.passport-given{font-size:12px;color:#5D6B8C}
.passport-name{font-size:22px;font-weight:700;color:#0B2A6F;margin:2px 0}
.passport-school{font-size:12px;color:#5D6B8C;margin-bottom:14px}
.passport-competency{background:#E8F0FF;border-radius:14px;padding:12px;margin-bottom:12px}
.passport-competency-label{font-size:11.5px;color:#5D6B8C}
.passport-competency-name{font-size:16px;font-weight:600;color:#0B2A6F;margin:2px 0 6px}
.passport-jurusan{display:inline-block;background:#FFC93C;color:#3A2A00;padding:2px 12px;border-radius:99px;font-size:12px;font-weight:600}
.passport-score-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.passport-score-box{background:#F3F6FF;border-radius:12px;padding:10px}
.passport-score-label,.passport-meta-label{display:block;font-size:11px;color:#5D6B8C}
.passport-score{font-size:26px;font-weight:700;color:#0B2A6F}
.passport-result{font-weight:700;font-size:13px}
.passport-result.mem{color:#12B76A}.passport-result.cukup{color:#B45500}.passport-result.kurang{color:#E5484D}
.passport-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.passport-meta-item{text-align:left}
.passport-meta-value{font-weight:600;font-size:13px}
.passport-footer{display:flex;justify-content:space-between;border-top:1px dashed #E2E8F6;padding-top:10px;font-size:11.5px;color:#5D6B8C;text-align:left}
.passport-actions{display:grid;gap:8px;margin-top:12px}
.passport-note{font-size:12px;color:var(--muted);margin-top:12px}
#pdfPassportRender{position:fixed;left:-9999px;top:0;width:520px;background:#fff}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- FUNGSI PENCARIAN AI ---------- */

function findAIAnswer(jurusan, pertanyaan){

  const text = String(pertanyaan || '').toLowerCase().trim();

  if(!text){
    return {
      found:false,
      steps:[],
      message:AI_GREETING[jurusan] || AI_GREETING['umum']
    };
  }

  const kb = [
    ...(AIKB[jurusan] || []),
    ...(AIKB['umum'] || [])
  ];

  let best = null;
  let bestScore = 0;

  kb.forEach(item => {

    let score = 0;

    item.k.forEach(keyword => {

      const key = keyword.toLowerCase();

      if(text.includes(key)){
        score += key.length >= 6 ? 3 : 2;
      }

    });

    if(score > bestScore){
      bestScore = score;
      best = item;
    }

  });

  if(best && bestScore > 0){

    return {
      found:true,
      score:bestScore,
      steps:best.s,
      message:'Berikut langkah yang bisa kamu gunakan:'
    };

  }

  return {
    found:false,
    score:0,
    steps:[],
    message:AI_FALLBACK[jurusan] || AI_FALLBACK['umum']
  };

}


/* ---------- FORMAT JAWABAN AI ---------- */

function formatAIAnswer(jurusan, pertanyaan){

  const result = findAIAnswer(jurusan,pertanyaan);

  if(!result.found){
    return result.message;
  }

  let html = '';

  html += `<div class="ai-answer">`;
  html += `<strong>${esc(result.message)}</strong>`;

  if(result.steps && result.steps.length){

    html += `<ol class="ai-steps">`;

    result.steps.forEach(step => {
      html += `<li>${esc(step)}</li>`;
    });

    html += `</ol>`;

  }

  html += `</div>`;

  return html;
}

function detectAIJurusan(text){

  const t = String(text || '').toLowerCase();

  if(
    t.includes('jurnal') ||
    t.includes('debit') ||
    t.includes('kredit') ||
    t.includes('neraca') ||
    t.includes('akuntansi') ||
    t.includes('piutang') ||
    t.includes('utang usaha') ||
    t.includes('persamaan akuntansi') ||
    t.includes('laba rugi')
  ){
    return 'Akuntansi';
  }

  if(
    t.includes('motor') ||
    t.includes('mobil') ||
    t.includes('mesin') ||
    t.includes('oli') ||
    t.includes('busi') ||
    t.includes('rem') ||
    t.includes('aki') ||
    t.includes('ban')
  ){
    return 'Otomotif';
  }

  if(
    t.includes('hotel') ||
    t.includes('tamu') ||
    t.includes('check in') ||
    t.includes('check-in') ||
    t.includes('check out') ||
    t.includes('housekeeping') ||
    t.includes('resepsionis') ||
    t.includes('reservasi')
  ){
    return 'Perhotelan';
  }

  if(
    t.includes('masak') ||
    t.includes('memasak') ||
    t.includes('dapur') ||
    t.includes('resep') ||
    t.includes('pisau') ||
    t.includes('julienne') ||

    t.includes('goreng') ||

  }

  return 'umum';

}

function toast(msg,type='info'){
  const t=document.createElement('div');t.className='toast-t '+type;
  t.innerHTML=(type==='ok'?ic('check'):type==='warn'?ic('lock'):ic('sparkle'))+`<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);requestAnimationFrame(()=>t.classList.add('in'));
  setTimeout(()=>{t.classList.remove('in');setTimeout(()=>t.remove(),260)},2700);
}
let AC;
function sfx(k){
  if(!SET.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
    const f={ok:[660,880],bad:[240,180],pop:[520,780]}[k]||[600,600],t=AC.currentTime;
    o.frequency.setValueAtTime(f[0],t);o.frequency.setValueAtTime(f[1],t+.1);g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.26)}catch(e){}
}
function confetti(n=80){
  if(RM())return;
  const c=$('#confetti');if(!c||!c.getContext)return;const x=c.getContext('2d');if(!x)return;
  c.width=innerWidth;c.height=innerHeight;c.style.display='block';
  const cols=['#2F6BFF','#FF8A1F','#FFC93C','#0FA5A0','#ffffff'];
  const P=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*11-3,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[rnd(0,4)]}));
  let f=0;(function step(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});
    if(++f<110)requestAnimationFrame(step);else{x.clearRect(0,0,c.width,c.height);c.style.display='none'}})();
}
function countUp(el,to,ms=700){
  if(!el)return;const from=+el.dataset.v||0;el.dataset.v=to;
  if(RM()||from===to){el.textContent=to.toLocaleString('id-ID');return}
  const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/ms);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3))).toLocaleString('id-ID');if(p<1)requestAnimationFrame(f)})(t0);
}

/* ---------- poin, streak, misi, lencana ---------- */
function addPts(a){S.points+=a;S.lifetime+=a;S.weekPoints+=a;if(!navigator.onLine)S.pending++}
function touchStreak(){
  const t=dstr();if(S.lastActive===t)return;
  const y=new Date();y.setDate(y.getDate()-1);
  S.streak=(S.lastActive===dstr(y))?S.streak+1:1;S.lastActive=t;
  if(premium()&&S.streak>1){const b=Math.min(S.streak*5,50);addPts(b);toast(`Bonus streak ${S.streak} hari: +${b} poin`,'ok')}

function award(base,why){
  rollover();touchStreak();
  let amt=Math.round(base*(premium()?2:1));
  if(!premium()){
    const left=Math.max(0,FREE_CAP-S.daily.freeEarned);
    if(left<=0){toast('Batas poin harian gratis tercapai. Premium tanpa batas.','warn');save();return 0}
    amt=Math.min(amt,left);S.daily.freeEarned+=amt;
  }
  addPts(amt);save();refreshChips();toast(`+${amt} poin · ${why}`,'ok');checkBadges();return amt;
}

function getPassportResult(score){
  score=Number(score)||0;

  if(score>=85){
    return {
      label:'Memuaskan',
      cls:'mem'
    };
  }

  if(score>=70){
    return {
      label:'Cukup Memuaskan',
      cls:'cukup'
    };
  }

  return {
    label:'Kurang Memuaskan',
    cls:'kurang'
  };
}

function getPassportScore(id){
  return Math.round(Number(S.done.latihan[id]||0));
}

function issuePassport(id){
  if(!premium()||!S.mastered[id])return null;

  const k=KOMP.find(x=>x.id===id);
  if(!k)return null;

  const score=getPassportScore(id);
  const result=getPassportResult(score);

  if(!S.passports[id]){
    S.passports[id]={
      code:'TV-'+
        Math.random().toString(36).slice(2,6).toUpperCase()+
        '-'+
        Math.random().toString(36).slice(2,6).toUpperCase(),
      date:Date.now(),
      score:score,
      result:result.label
    };

    save();
    checkBadges();
  }else{
    /* Data lama tetap bisa digunakan */
    if(S.passports[id].score===undefined){
      S.passports[id].score=score;
    }

    if(!S.passports[id].result){
      S.passports[id].result=getPassportResult(S.passports[id].score).label;
    }

    save();
  }

  return S.passports[id];
}

async function hashPw(pw,salt){
  const s=salt+':'+pw;
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'f'+h.toString(16);
}

 {jur:'Akuntansi',nama:'Siswa Demo Akuntansi',sekolah:'SMKN 1 Sukoharjo'},
 {jur:'Otomotif',nama:'Siswa Demo Otomotif',sekolah:'SMK Muhammadiyah 1 Klaten'},
 {jur:'Perhotelan',nama:'Siswa Demo Perhotelan',sekolah:'SMKN 2 Surakarta'},
 {jur:'Tata Boga',nama:'Siswa Demo Tata Boga',sekolah:'SMKN 1 Karanganyar'}
];
async function seedDummyUsers(){
  const existing=users();
  const have=new Set(existing.map(u=>u.email));
  let changed=false;
  for(const d of DUMMY_DEF){
    const email='demo.'+d.jur.toLowerCase().replace(/\s+/g,'')+'@tramvior.id';
    if(have.has(email))continue;
    const salt=Math.random().toString(36).slice(2);
    existing.push({id:'u_demo_'+d.jur.toLowerCase().replace(/\s+/g,''),nama:d.nama,email,salt,hash:await hashPw('demo123',salt),jurusan:d.jur,kelas:'XI',sekolah:d.sekolah,avatar:'',kartuJurusan:'',kartuVerified:true,kartuTanggal:Date.now(),createdAt:Date.now()});
    changed=true;
  }
  if(changed)saveUsers(existing);
}

function showAuth(mode='login'){
  showSec('auth');
  const login=mode==='login';
  $('#auth').innerHTML=`<div class="auth">
   <div class="auth-brand">${logo(46)}<div><h1>Tramvior</h1><p>TRAMPIL-in Masa Depanmu!</p></div></div>
   <div class="seg" role="tablist"><button class="${login?'on':''}" data-m="login" role="tab">Masuk</button><button class="${!login?'on':''}" data-m="register" role="tab">Daftar</button></div>
   ${login?`
   <form id="fLogin" novalidate>
    <div class="mb-3"><label class="form-label" for="lEmail">Email</label><input id="lEmail" type="email" class="form-control" autocomplete="email" placeholder="nama@email.com"><div class="err" data-for="lEmail"></div></div>
    ${pwField('lPass','Kata sandi','Masukkan kata sandi')}
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="form-check m-0"><input class="form-check-input" type="checkbox" id="lRem" checked><label class="form-check-label" for="lRem">Tetap masuk</label></div>
      <a href="#" id="lForgot">Lupa kata sandi?</a></div>
    <div class="err mb-2" id="lErr"></div>
    <button class="btn btn-t w-100" type="submit">Masuk</button>
    <p class="small muted text-center mt-3 mb-2">Atau coba akun demo per jurusan (sandi: demo123)</p>
    <div class="grid2" id="demoGrid">${DUMMY_DEF.map(d=>`<button type="button" class="sc" style="min-height:64px" data-demo="${d.jur}"><div class="ic-w">${ic(JUR[d.jur].ic)}</div><b>${esc(d.jur)}</b></button>`).join('')}</div>
   </form>`:`
   <form id="fReg" novalidate>
    <div class="mb-3"><label class="form-label" for="rNama">Nama lengkap</label><input id="rNama" class="form-control" autocomplete="name" placeholder="Nama kamu"><div class="err" data-for="rNama"></div></div>
    <div class="mb-3"><label class="form-label" for="rEmail">Email</label><input id="rEmail" type="email" class="form-control" autocomplete="email" placeholder="nama@email.com"><div class="err" data-for="rEmail"></div></div>
    ${pwField('rPass','Kata sandi (minimal 6 karakter)','Buat kata sandi')}
    <div class="row g-2 mb-3">
      <div class="col-7"><label class="form-label" for="rJur">Jurusan</label><select id="rJur" class="form-select">${Object.keys(JUR).map(j=>`<option>${j}</option>`).join('')}</select></div>
      <div class="col-5"><label class="form-label" for="rKelas">Kelas</label><select id="rKelas" class="form-select">${KELAS.map(k=>`<option>${k}</option>`).join('')}</select></div>
    </div>
    <div class="mb-3"><label class="form-label" for="rSek">Nama sekolah</label><input id="rSek" class="form-control" placeholder="Contoh: SMKN 1 Sukoharjo"><div class="err" data-for="rSek"></div></div>
    <div class="mb-3"><label class="form-label" for="rKartu">Foto kartu pelajar / kartu identitas jurusan</label>
     <p class="small muted mb-2">Foto harus menunjukkan namamu dan jurusan yang tertulis di kartu. Jurusan pada akunmu mengikuti kartu ini dan hanya bisa diubah oleh Admin sekolah.</p>
     <div class="d-flex align-items-center gap-2">
      <label class="btn btn-ghost btn-sm" style="cursor:pointer">${ic('phone','sm')} Ambil/unggah foto<input id="rKartu" type="file" accept="image/*" capture="environment" hidden></label>
      <span class="small muted" id="rKartuName">Belum ada foto</span>
     </div>
     <img id="rKartuPrev" hidden style="max-width:100%;border-radius:12px;margin-top:8px;border:1px solid var(--line)">
     <div class="err" data-for="rKartu"></div></div>
    <button class="btn btn-t w-100" type="submit">Buat akun</button>
    <p class="small muted mt-3">Data akunmu, termasuk foto kartu, disimpan di perangkat ini (localStorage), bukan dikirim ke server mana pun.</p>
   </form>`}
  </div>`;
  const root=$('#auth');bindPwToggles(root);
  $$('.seg button',root).forEach(b=>b.onclick=()=>showAuth(b.dataset.m));
  if(login){
    $$('#demoGrid [data-demo]',root).forEach(b=>b.onclick=async()=>{
      await seedDummyUsers();
      const email='demo.'+b.dataset.demo.toLowerCase().replace(/\s+/g,'')+'@tramvior.id';
      const u=users().find(x=>x.email===email);

      if(!EMAIL_RE.test(email)){fErr('rEmail','Masukkan email yang valid, contoh nama@email.com');bad=true}
      else if(users().some(x=>x.email===email)){fErr('rEmail','Email sudah terdaftar. Masuk lewat tab Masuk.');bad=true}
      if(pw.length<6){fErr('rPass','Kata sandi minimal 6 karakter');bad=true}
      if(sek.length<3){fErr('rSek','Isi nama sekolahmu');bad=true}
      if(!rKartuFile){fErr('rKartu','Wajib unggah foto kartu pelajar atau kartu identitas jurusan');bad=true}
      if(bad)return;
      const kartuB64=await fileToBase64(rKartuFile);
      const salt=Math.random().toString(36).slice(2);
      const u={id:'u_'+Date.now().toString(36)+rnd(10,99),nama,email,salt,hash:await hashPw(pw,salt),jurusan:$('#rJur').value,kelas:$('#rKelas').value,sekolah:sek,avatar:'',kartuJurusan:kartuB64,kartuVerified:true,kartuTanggal:Date.now(),createdAt:Date.now()};
      saveUsers([...users(),u]);startSession(u,true);
    };
  }
}

function forgotFlow(){
  let code='',mail='';
  const m=modal(`<div class="p-4" id="fg"></div>`);
  const step1=()=>{$('#fg').innerHTML=`<h4 class="mb-1">Lupa kata sandi</h4><p class="muted small mb-3">Masukkan email akunmu. Karena prototipe ini tanpa server email, kode reset ditampilkan di layar.</p><div class="mb-3"><input id="fEmail" type="email" class="form-control" placeholder="nama@email.com"><div class="err" data-for="fEmail"></div></div><div class="d-flex gap-2"><button class="btn btn-ghost flex-fill" data-close>Batal</button><button class="btn btn-t flex-fill" id="fGo">Kirim kode</button></div>`;
    $('#fGo').onclick=()=>{mail=$('#fEmail').value.trim().toLowerCase();fErr('fEmail','');
      if(!EMAIL_RE.test(mail))return fErr('fEmail','Masukkan email yang valid');
      if(!users().some(u=>u.email===mail))return fErr('fEmail','Email belum terdaftar');
      code=String(rnd(100000,999999));step2()}};
  const step2=()=>{$('#fg').innerHTML=`<h4 class="mb-1">Masukkan kode</h4><div class="banner"><span>Kode reset (simulasi): <b>${code}</b></span></div><div class="mb-3"><label class="form-label" for="fCode">Kode</label><input id="fCode" class="form-control" inputmode="numeric" maxlength="6"><div class="err" data-for="fCode"></div></div>${pwField('fPass','Kata sandi baru','Minimal 6 karakter')}<div class="d-flex gap-2"><button class="btn btn-ghost flex-fill" data-close>Batal</button><button class="btn btn-t flex-fill" id="fSave">Simpan</button></div>`;
    bindPwToggles($('#fg'));
    $('#fSave').onclick=async()=>{fErr('fCode','');fErr('fPass','');
      if($('#fCode').value.trim()!==code)return fErr('fCode','Kode tidak cocok');
      const pw=$('#fPass').value;if(pw.length<6)return fErr('fPass','Kata sandi minimal 6 karakter');
      const all=users(),u=all.find(x=>x.email===mail);u.salt=Math.random().toString(36).slice(2);u.hash=await hashPw(pw,u.salt);saveUsers(all);
      closeModal();toast('Kata sandi diperbarui. Silakan masuk.','ok')}};
  step1();
}

function startSession(user,remember){
  U=user;S=LS.get(stKey(user.id),null)||newState();
  S.premium=S.premium||{on:false};S.chat=S.chat||[];
  rollover();save();setSession(user.id,remember);
  showSec('shell');renderTop();renderTabs();
  if(location.hash==='#/beranda')render();else location.hash='#/beranda';
}
function logout(){clearSession();CLEAN();CLEAN=()=>{};U=null;S=null;location.hash='';showAuth('login')}

const TABS=[['beranda','Beranda','home'],['belajar','Belajar','book'],['quest','Quest','target'],['kerja','Dunia Kerja','briefcase'],['profil','Profil','user']];
function renderTabs(){$('#tabbar').innerHTML=TABS.map(t=>`<a class="tab" href="#/${t[0]}" data-t="${t[0]}">${ic(t[2])}<span>${t[1]}</span></a>`).join('')}
function setTab(t){$$('#tabbar .tab').forEach(a=>{const on=a.dataset.t===t;a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}

let netTimer;
function netBar(state){
  const b=$('#netBar');clearTimeout(netTimer);
  const d=$('#netDot');if(d){d.classList.toggle('off',!navigator.onLine);d.title=navigator.onLine?'Online':'Offline'}
  if(state==='off'){b.className='netbar off';b.innerHTML=ic('wifioff','sm')+`<span>Kamu offline. Progres tersimpan di perangkat${S&&S.pending?` (${S.pending} menunggu sinkron)`:''}.</span>`;b.hidden=false}
  else if(state==='sync'){b.className='netbar sync';b.innerHTML=ic('refresh','sm')+'<span>Kembali online. Menyinkronkan progres...</span>';b.hidden=false;
    netTimer=setTimeout(()=>{if(S){S.pending=0;S.lastSync=Date.now();save()}b.hidden=true;toast('Progres tersinkron','ok')},1800)}
  else b.hidden=true;
}
function bindNet(){
  window.addEventListener('offline',()=>netBar('off'));
  window.addEventListener('online',()=>netBar('sync'));
  if(!navigator.onLine)netBar('off');
}

const sub=(title,back)=>`<div class="sub-h"><a class="icon-btn" href="#/${back}" aria-label="Kembali">${ic('arrowleft')}</a><h2>${esc(title)}</h2></div>`;
const skel=()=>`<div class="skel" aria-hidden="true"><i style="height:26px;width:55%"></i><i style="height:150px"></i><i style="height:74px"></i><i style="height:74px"></i></div>`;
function go(h){if(location.hash==='#/'+h)render();else location.hash='#/'+h}
let RT=0;
function render(){
  if(!U)return;
  CLEAN();CLEAN=()=>{};rollover();
  const raw=(location.hash||'#/beranda').replace(/^#\/?/,'');
  const [nm,...a]=raw.split('/');
  const V=VIEWS[nm||'beranda'];
  if(!V){go('beranda');return}
  if(V.g&&V.g(...a)===false)return;
  setTab(V.tab);
  const tk=++RT,view=$('#view');view.innerHTML=skel();
  setTimeout(()=>{
    if(tk!==RT)return;
    view.innerHTML=`<div class="view-in">${V.h(...a)}</div>`;
    if(V.b)V.b(...a);
    window.scrollTo(0,0);
  },130);
}
window.addEventListener('hashchange',render);

/* ambil ID video dari URL YouTube apa pun (watch, youtu.be, embed, shorts) atau ID polos */
const ytId=v=>{
  if(!v)return null;
  const m=String(v).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  return m?m[1]:(/^[\w-]{11}$/.test(v)?v:null);
};
function loadYT(){
  return new Promise(res=>{
    if(window.YT&&YT.Player)return res();
    const prev=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{prev&&prev();res()};
    if(!document.getElementById('ytapi')){
      const s=document.createElement('script');s.id='ytapi';s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
    }
  });
}
function videoH(id){
  const k=KOMP.find(x=>x.id===id);const j=JUR[k.jur];
  const vid=ytId(k.yt);
  const q=encodeURIComponent(k.ytQuery);
  const ytBlock=vid
    ?`<div class="yt-wrap"><div id="ytPlayer"></div></div>`
    :`<div class="yt-wrap" style="background:${j.c}"><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener" style="color:#fff;text-align:center;padding:20px;text-decoration:none">${ic('video','lg')}<br><b>Cari video di YouTube</b><br><small style="opacity:.85">${esc(k.ytQuery)}</small></a></div>`;
  return `${sub(k.judul,'belajar')}<div class="px">
   <div class="vstage" style="--jc:${j.c}">
    ${ytBlock}
    <div class="vmeta"><h3>${esc(k.judul)}</h3><p>${esc(k.jur)} · sekitar ${k.durMin} menit · ${k.cp.length} jeda kuis</p></div>
   </div>
   <div class="vctl">${vid?'':`<button class="btn btn-o" id="vPlay">${ic('play')} Saya sudah menonton, mulai kuis jeda</button>`}<span class="muted small" id="vTime"></span></div>
   <div style="position:relative;height:6px;background:var(--line);border-radius:4px;margin-bottom:14px"><i id="vsBar" style="position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:4px;width:0;transition:width .3s"></i></div>
   <p class="small muted mb-2">${vid?'Putar videonya di atas. Video akan berhenti otomatis di beberapa titik untuk kuis jeda.':'Tonton video pilihanmu di YouTube lewat tautan di atas, lalu kembali ke sini.'} ${premium()?'Jawaban benar menambah poin.':'Poin dari video khusus Premium.'}</p>
   <div id="vCP"></div><div id="vEnd"></div></div>`;

function videoB(id){
  const k=KOMP.find(x=>x.id===id);if(!k)return;
  const vid=ytId(k.yt);
  const SIMT=Math.max(20,k.durMin*6);
  let t=0,total=vid?0:SIMT,playing=false,waiting=false,tm=null,right=0,player=null,finished=false;
  const doneCP=new Set();
  const bar=$('#vsBar'),play=$('#vPlay'),time=$('#vTime');
  const fm=s=>Math.floor(s/60)+':'+pad(Math.floor(s)%60);
  CLEAN=()=>{clearInterval(tm);if(player&&player.destroy){try{player.destroy()}catch(e){}}};
  function draw(){if(!total)return;bar.style.width=Math.min(100,t/total*100)+'%';time.textContent=fm(t)+' / '+fm(total)}

  function showCP(ix){
    const q=mix(k.cp[ix]);
    $('#vCP').innerHTML=`<div class="card-t cp view-in mb-3"><span class="pill pill-o">Jeda kuis ${ix+1} dari ${k.cp.length}</span><h4>${esc(q.q)}</h4><div class="opts">${q.o.map((x,n)=>`<button class="opt" data-i="${n}"><span class="ol">${'ABCD'[n]}</span>${esc(x)}</button>`).join('')}</div><div id="cpFb"></div></div>`;
    $('#vCP').scrollIntoView({behavior:'smooth',block:'center'});
    sfx('pop');
    $$('#vCP .opt').forEach(b=>b.onclick=()=>{
      const n=+b.dataset.i,good=n===q.a;doneCP.add(ix);
      logAnswer('video-jeda',k.id,q.q,q.o[n],q.o[q.a],good);save();
      $$('#vCP .opt').forEach((o,j)=>{o.disabled=true;if(j===q.a&&good)o.classList.add('good');if(j===n&&!good)o.classList.add('bad')});
      let h='';
      if(good){right++;sfx('ok');if(premium())award(5,'Jawaban benar');h=`<div class="fb ok">Jawabanmu benar!${premium()?'':' Poin video khusus Premium.'}</div>`}
      else{sfx('bad');h=`<div class="fb bad">Jawabanmu keliru.</div>`}
      if(premium()&&!good)h+=`<div class="pemb"><b>Pembahasan</b><p>${esc(q.e)}</p></div>`;
      else if(!premium()&&!good)h+=`<button class="lockbox" data-up="Pembahasan jawaban khusus Premium.">${ic('lock')}Lihat pembahasan lengkap dengan Premium</button>`;
      h+=`<button class="btn btn-t w-100 mt-3" id="cpNext">Lanjutkan</button>`;
      $('#cpFb').innerHTML=h;
      $('#cpNext').onclick=()=>{
        $('#vCP').innerHTML='';waiting=false;
        if(vid){player.playVideo()}
        else{if(t>=total)finish();else resume()}
      };
    });
  }
  function finish(){
    if(finished)return;finished=true;
    S.done.video[k.id]=true;save();track('video');const nm=tryMaster(k.id);checkBadges();
    $('#vEnd').innerHTML=`<div class="card-t view-in mb-3"><h4>Video selesai</h4><p class="muted mb-2">${right} dari ${k.cp.length} kuis jeda dijawab benar.</p>
     <div class="info"><b>Rangkuman</b><ul>${k.ringkas.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>
     ${nm?`<div class="banner"><span><b>Kompetensi dikuasai!</b></span><a href="#/passport/${k.id}">Lihat Skill Passport</a></div>`:''}
     <div class="d-grid gap-2 mt-3"><a class="btn btn-t" href="#/soal/${k.id}">Lanjut ke latihan soal</a><button class="btn btn-ghost" id="vAgain">Ulangi</button></div></div>`;
    if(right===k.cp.length)confetti(50);
    $('#vAgain').onclick=()=>{
      t=0;doneCP.clear();right=0;finished=false;$('#vEnd').innerHTML='';
      if(vid){player.seekTo(0);player.playVideo()}else{draw();setBtn()}
    };
  }

  /* ===== MODE 1: video YouTube asli, diputar di dalam aplikasi ===== */
  if(vid){
    const poll=()=>{
      if(!player||!player.getCurrentTime||waiting)return;
      total=player.getDuration()||0;t=player.getCurrentTime();draw();
      if(!total)return;
      const ix=k.cp.findIndex((c,n)=>!doneCP.has(n)&&t>=c.at*total);
      if(ix>-1){waiting=true;player.pauseVideo();showCP(ix)}
    };
    loadYT().then(()=>{
      player=new YT.Player('ytPlayer',{
        videoId:vid,
        host:'https://www.youtube-nocookie.com',
        playerVars:{rel:0,playsinline:1,modestbranding:1},
        events:{
          onStateChange:e=>{
            if(e.data===YT.PlayerState.PLAYING){clearInterval(tm);tm=setInterval(poll,500)}
            else if(e.data===YT.PlayerState.ENDED){clearInterval(tm);if(!waiting)finish()}
            else clearInterval(tm);
          },
          onError:()=>toast('Video tidak bisa diputar. Cek ID atau koneksi internet.','warn')
        }
      });
    });
    return;
  }

  /* ===== MODE 2: belum ada ID video, pakai simulasi seperti sebelumnya ===== */
  function setBtn(){play.innerHTML=playing?ic('pause')+' Jeda':ic('play')+(t>0&&t<total?' Lanjut':' Saya sudah menonton, mulai kuis jeda')}
  function resume(){playing=true;clearInterval(tm);tm=setInterval(tick,200);setBtn()}
  function tick(){
    t+=.2;
    const ix=k.cp.findIndex((c,n)=>!doneCP.has(n)&&t>=c.at*total);
    if(ix>-1){t=k.cp[ix].at*total;draw();playing=false;waiting=true;clearInterval(tm);setBtn();showCP(ix);return}
    if(t>=total){t=total;draw();playing=false;clearInterval(tm);setBtn();finish();return}
    draw();
  }
  play.onclick=()=>{
    if(waiting)return;
    if(t>=total){t=0;doneCP.clear();right=0;finished=false;$('#vEnd').innerHTML=''}
    if(playing){playing=false;clearInterval(tm);setBtn()}else resume();
  };
  draw();setBtn();
}

function runSoal(mode,kid){
  CLEAN();CLEAN=()=>{};
  const pool=jurPool(U.jurusan);
  const left=premium()?99:Math.max(0,FREE_SOAL-S.daily.soal);
  if(mode!=='ujian'&&!premium()&&left<=0&&!kid){upgrade(`Latihan gratis dibatasi ${FREE_SOAL} soal per hari. Coba lagi besok atau buka Premium.`);go('belajar');return}
  let qs;
  if(mode==='ujian')qs=shuffle(pool).slice(0,UJIAN_N);
  else if(kid){const k=KOMP.find(x=>x.id===kid);qs=k?k.soal.map(s=>({...s,kid})).slice(0,left||k.soal.length):[]}
  else qs=shuffle(pool).slice(0,Math.min(LATIHAN_N,left));
  qs=qs.map(mix);
  const box=$('#qbox');
  if(!qs.length){box.innerHTML=`<div class="empty">${ic('pencil')}<b>Belum ada soal</b>Pilih kompetensi dari menu Belajar.</div>`;return}
  let i=0,ok=0,tid=null,rem=qs.length*UJIAN_SEC;const rec=[];
  CLEAN=()=>clearInterval(tid);
  if(mode==='ujian'){
    const tt=()=>{$('#qtime').innerHTML=`${ic('clock','sm')} ${Math.floor(rem/60)}:${pad(rem%60)}`};tt();
    tid=setInterval(()=>{rem--;tt();if(rem<=0){clearInterval(tid);toast('Waktu habis','warn');finish()}},1000);
  }else $('#qtime').innerHTML='';
  function showQ(){
    const q=qs[i];
    $('#qprog').style.width=(i/qs.length*100)+'%';$('#qcount').textContent=`Soal ${i+1} dari ${qs.length}`;
    box.innerHTML=`<div class="card-t view-in"><h3 class="q">${esc(q.q)}</h3><div class="opts">${q.o.map((x,n)=>`<button class="opt" data-i="${n}"><span class="ol">${'ABCD'[n]}</span>${esc(x)}</button>`).join('')}</div><div id="fb"></div></div>`;
    $$('.opt',box).forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  }
  function pick(n){
    const q=qs[i],good=n===q.a;rec.push({q,n,good});if(good)ok++;
    if(mode==='ujian'){next();return}
    $$('.opt',box).forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('good');if(j===n&&!good)b.classList.add('bad')});
    S.daily.soal++;if(good)S.correct++;
    logAnswer(mode,q.kid,q.q,q.o[n],q.o[q.a],good);
    if(good){award(2,'Jawaban benar');sfx('ok')}else sfx('bad');
    track('soal');save();
    let h=`<div class="fb ${good?'ok':'bad'}">${good?'Benar!':'Kurang tepat. Jawaban yang benar: '+esc(q.o[q.a])}</div>`;
    h+=premium()?`<div class="pemb"><b>Cara mengerjakan</b><ol>${q.e.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`
      :`<button class="lockbox" data-up="Pembahasan langkah demi langkah khusus Premium.">${ic('lock')}Pembahasan langkah demi langkah ada di Premium</button>`;
    h+=`<button class="btn btn-t w-100 mt-3" id="nx">${i+1<qs.length?'Soal berikutnya':'Lihat hasil'}</button>`;
    $('#fb').innerHTML=h;$('#nx').onclick=next;
  }
  function next(){i++;if(i<qs.length)showQ();else finish()}
  function finish(){
    clearInterval(tid);
    const n=qs.length,pct=Math.round(ok/n*100);$('#qprog').style.width='100%';
    let extra='',rv='';
    if(mode==='ujian'){
      S.correct+=ok;S.daily.soal+=rec.length;track('soal',rec.length);
      rec.forEach(r=>logAnswer('ujian',r.q.kid,r.q.q,r.q.o[r.n],r.q.o[r.q.a],r.good));
      award(10+Math.round(pct*.4),'Ujian selesai');S.examBest=Math.max(S.examBest,pct);save();
      rv=rec.map((r,x)=>`<div class="rv"><b>${x+1}. ${esc(r.q.q)}</b><br>${r.good?'<span style="color:var(--ok)">Benar</span>':`<span style="color:var(--bad)">Salah</span>. Jawaban benar: ${esc(r.q.o[r.q.a])}`}<ol class="mb-0 mt-1 muted">${r.q.e.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`).join('');
    }else if(kid&&pct>=70){
      S.done.latihan[kid]=Math.max(S.done.latihan[kid]||0,pct);save();
      if(tryMaster(kid))extra=`<div class="banner"><span><b>Kompetensi dikuasai!</b></span><a href="#/passport/${kid}">Lihat Skill Passport</a></div>`;
    }
    const msg=pct>=70?'Kerja bagus! Pertahankan.':kid?'Nilai minimal 70% untuk menguasai kompetensi. Coba lagi ya.':'Terus berlatih, kamu pasti bisa.';
    box.innerHTML=`<div class="card-t text-center view-in"><div class="score ${pct>=70?'hi':''}">${pct}<small>%</small></div><p class="mt-1">${ok} dari ${n} soal benar</p><p class="muted small">${msg}</p>${extra}${mode==='ujian'?`<p class="small muted mt-2">Skor ujian terbaikmu: ${S.examBest}%</p><div class="mt-3">${rv}</div>`:''}
     <div class="d-grid gap-2 mt-3"><button class="btn btn-t" id="again">Ulangi</button><a class="btn btn-ghost" href="#/belajar">Kembali ke Belajar</a></div></div>`;
    $('#again').onclick=()=>render();
    if(pct>=70)confetti(50);
  }
  showQ();
}

function tutorAnswer(q){
  const s=q.toLowerCase(),jw=SET.jawa;
  let best=null,bs=0;
  [...(AIKB[U.jurusan]||[]),...AIKB.umum].forEach(e=>{const sc=e.k.filter(k=>s.includes(k)).length;if(sc>bs){bs=sc;best=e}});
  if(!best){const h=AI_HINT[U.jurusan].join(', ');return{text:jw?`Wah, iki durung ana ing materi prototipe. Coba takon babagan: ${h}.`:`Topik itu belum ada di materi prototipe ini. Coba tanya tentang: ${h}.`,cut:false}}
  const steps=premium()?best.s:best.s.slice(0,2);
  let t=(jw?'Yo, tak jelasno alon-alon ya:':'Oke, ini langkah-langkahnya:')+'\n'+steps.map((x,i)=>`Langkah ${i+1}: ${x}`).join('\n');
  t+=premium()?(jw?'\n\nYen isih bingung, takon meneh wae ya.':'\n\nKalau masih bingung, tanya lagi ya.'):'';
  return{text:t,cut:!premium()};
}
function tutorB(){

  const lim=()=>{$('#aiLim').textContent=premium()?'Tanpa batas':`Sisa ${Math.max(0,FREE_AI-S.daily.ai)} dari ${FREE_AI} pertanyaan hari ini`};
  const lockNote=()=>{const b=document.createElement('button');b.type='button';b.className='lockbox';b.dataset.up='Langkah lengkap dan AI Tutor tanpa batas khusus Premium.';b.innerHTML=ic('lock')+'Lihat langkah lengkap dengan Premium';box.appendChild(b)};
  add('a',`Halo ${U.nama.split(' ')[0]}! Aku AI Tutor untuk jurusan ${U.jurusan}. Tanya apa saja, nanti aku pecah jadi langkah-langkah kecil.`,false);
  S.chat.forEach(m=>add(m.r,m.t,false));lim();
  $('#sugg').innerHTML=AI_HINT[U.jurusan].map(h=>`<button type="button">${esc(h)}</button>`).join('');

  function ask(q){
    q=q.trim();if(!q||busy)return;
    if(!navigator.onLine){add('u',q);add('a','AI Tutor butuh internet (sinyal 2G sudah cukup). Materi video dan latihan soal tetap bisa dipakai offline.');inp.value='';return}
    if(!premium()&&S.daily.ai>=FREE_AI){upgrade(`AI Tutor gratis dibatasi ${FREE_AI} pertanyaan per hari.`);return}
    busy=true;inp.value='';add('u',q);S.daily.ai++;
    const typing=add('a','');typing.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
    const r=tutorAnswer(q);
    S.chat.push({r:'u',t:q},{r:'a',t:r.text});S.chat=S.chat.slice(-20);save();lim();track('ai');
    tid=setTimeout(()=>{
      typing.textContent='';let n=0;
      (function step(){
        n=RM()?r.text.length:n+3;typing.textContent=r.text.slice(0,n);typing.scrollIntoView({block:'end'});
        if(n<r.text.length)tid=setTimeout(step,18);else{if(r.cut)lockNote();busy=false}
      })();
    },700);
  }
  form.onsubmit=e=>{e.preventDefault();ask(inp.value)};
}

   <div class="chat" id="simChat"></div><div id="simEnd"></div>
   <form class="chat-in" id="simForm" style="position:static"><input id="simIn" class="form-control" placeholder="Ketik balasanmu..." autocomplete="off"><button class="btn btn-o" aria-label="Kirim">${ic('send')}</button></form>
   <button class="btn btn-ghost btn-sm mt-2" id="simHint">${ic('sparkle','sm')} Lihat petunjuk</button>

function kerjaB(id){
  if(!id)return;
  const s=SIM.find(x=>x.id===id);if(!s)return;
  const box=$('#simChat');let i=0,scoreSum=0,busy=false;
  const add=(r,t)=>{const d=document.createElement('div');d.className='bub '+r;if(r==='a')d.innerHTML=`<span class="who">${esc(s.lawan)}</span>${esc(t)}`;else d.textContent=t;box.appendChild(d);d.scrollIntoView({block:'end'});return d};
  const fbk=(cls,head,body)=>{const d=document.createElement('div');d.className='fbk '+cls;d.innerHTML=`<b>${esc(head)}</b><i>${esc(body)}</i>`;box.appendChild(d);d.scrollIntoView({block:'end'})};
  function nextTurn(){
    if(i>=s.turns.length){finish();return}
    add('a',s.turns[i].ai);$('#simHint').dataset.tip=s.turns[i].tip;
  }
  add('s',`Sesi dimulai: ${s.judul}`);nextTurn();
  $('#simHint').onclick=()=>{if(i<s.turns.length)toast(s.turns[i].tip,'info')};
  $('#simForm').onsubmit=e=>{
    e.preventDefault();if(busy)return;const inp=$('#simIn'),v=inp.value.trim();if(!v)return;
    busy=true;add('u',v);inp.value='';
    const turn=s.turns[i],lv=v.toLowerCase();
    const hit=turn.kw.filter(k=>lv.includes(k)).length;
    const score=v.split(/\s+/).length<3?0:Math.min(3,hit);
    scoreSum+=score;
    setTimeout(()=>{
      if(score>=2)fbk('ok','Respons bagus!','Kamu memakai poin penting yang tepat untuk situasi ini.');
      else if(score===1)fbk('mid','Cukup, bisa lebih lengkap.',`Contoh yang lebih lengkap: "${turn.ex}"`);
      else fbk('bad','Coba lagi dengan lebih lengkap.',`Contoh: "${turn.ex}"`);
      i++;busy=false;setTimeout(nextTurn,500);
    },500);
  };
  function finish(){
    const pct=Math.round(scoreSum/(s.turns.length*3)*100);
    S.done.video['sim_'+s.id]=true;S.simDone++;track('sim');save();checkBadges();
    award(6+Math.round(pct*.2),'Sesi Dunia Kerja selesai');
    $('#simForm').style.display='none';$('#simHint').style.display='none';
    $('#simEnd').innerHTML=`<div class="card-t text-center view-in mt-2"><div class="score ${pct>=60?'hi':''}">${pct}<small>%</small></div><p class="muted small mt-1">Evaluasi AI untuk sesi ${esc(s.judul)}</p>
     <p class="small mt-2">${pct>=70?'Responsmu percaya diri dan sesuai konteks industri.':pct>=40?'Sudah cukup baik, tambahkan detail agar lebih meyakinkan.':'Coba latihan lagi dan gunakan contoh kalimat yang diberikan.'}</p>
     <div class="d-grid gap-2 mt-3"><button class="btn btn-t" id="simAgain">Ulangi sesi</button><a class="btn btn-ghost" href="#/kerja">Sesi lain</a></div></div>`;
    if(pct>=60)confetti(50);
    $('#simAgain').onclick=()=>render();
  }
}

/* =====================================================
   MEMBUAT PDF
   ===================================================== */

async function createPassportPDF(id){

  const data=passportData(id);

  if(!data||!data.p){
    toast('Terbitkan Skill Passport terlebih dahulu','warn');
    return null;
  }

  if(typeof html2canvas==='undefined' ||
     !window.jspdf ||
     !window.jspdf.jsPDF){

    toast('Fitur PDF belum siap. Periksa koneksi internet.','warn');
    return null;
  }


  let holder=document.getElementById('pdfPassportRender');

  if(!holder){

    holder=document.createElement('div');
    holder.id='pdfPassportRender';

    document.body.appendChild(holder);
  }


  holder.innerHTML=passportCertificate(id,true);


  /*
    Tunggu logo Tramvior selesai dimuat
    sebelum screenshot dibuat.
  */
  const images=holder.querySelectorAll('img');

  await Promise.all(
    [...images].map(img=>{

      if(img.complete)return Promise.resolve();

      return new Promise(resolve=>{
        img.onload=resolve;
        img.onerror=resolve;
      });

    })
  );


  await new Promise(resolve=>setTimeout(resolve,250));


  const canvas=await html2canvas(holder,{
    scale:2,
    useCORS:true,
    backgroundColor:'#ffffff',
    logging:false
  });


  const {jsPDF}=window.jspdf;


  const pdf=new jsPDF({
    orientation:'portrait',
    unit:'mm',
    format:'a4',
    compress:true
  });


  const pageWidth=210;
  const pageHeight=297;


  const imgData=canvas.toDataURL(
    'image/jpeg',
    .95
  );


  const ratio=Math.min(
    pageWidth/canvas.width,
    pageHeight/canvas.height
  );


  const imgWidth=canvas.width*ratio;
  const imgHeight=canvas.height*ratio;


  const x=(pageWidth-imgWidth)/2;
  const y=(pageHeight-imgHeight)/2;


  pdf.addImage(
    imgData,
    'JPEG',
    x,
    y,
    imgWidth,
    imgHeight
  );


  const safeName=(U.nama||'Peserta')
    .replace(/[^\w\s-]/g,'')
    .trim()
    .replace(/\s+/g,'-');


  const fileName=
    `Skill-Passport-Tramvior-${safeName}.pdf`;


  const blob=pdf.output('blob');


  return {
    pdf,
    blob,
    fileName
  };
}


/* =====================================================
   DOWNLOAD PDF
   ===================================================== */

async function downloadPassportPDF(id){

  const btn=$('#downloadP');

  if(btn){
    btn.disabled=true;
    btn.innerHTML=
      `${ic('loader','sm')} Membuat PDF...`;
  }


  try{

    const result=
      await createPassportPDF(id);

    if(!result)return;


    const url=
      URL.createObjectURL(result.blob);


    const a=document.createElement('a');

    a.href=url;
    a.download=result.fileName;

    document.body.appendChild(a);
    a.click();
    a.remove();


    setTimeout(()=>{
      URL.revokeObjectURL(url);
    },3000);


    toast(
      'Skill Passport PDF berhasil dibuat',
      'ok'
    );

  }catch(e){

    console.error(e);

    toast(
      'Gagal membuat PDF',
      'warn'
    );

  }finally{

    if(btn){

      btn.disabled=false;

      btn.innerHTML=
        `${ic('download','sm')} Unduh PDF`;

    }

  }
}


/* =====================================================
   BAGIKAN PDF
   ===================================================== */

async function sharePassportPDF(id){

  const data=passportData(id);

  if(!data||!data.p){

    toast(
      'Terbitkan Skill Passport terlebih dahulu',
      'warn'
    );

    return;
  }


  const btn=$('#waP');

  if(btn){

    btn.disabled=true;

    btn.innerHTML=
      `${ic('loader','sm')} Menyiapkan PDF...`;

  }


  try{

    const result=
      await createPassportPDF(id);

    if(!result)return;


    const file=new File(
      [result.blob],
      result.fileName,
      {
        type:'application/pdf'
      }
    );


    /*
      HP/browser yang mendukung Web Share
      dapat membagikan file PDF langsung.
    */

    if(
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({files:[file]})
    ){

      await navigator.share({

        title:'Skill Passport Tramvior',

        text:
          `Skill Passport Tramvior - ${data.k.judul}`,

        files:[file]

      });


      toast(
        'Skill Passport siap dibagikan',
        'ok'
      );

      return;
    }


    /*
      Jika browser tidak mendukung
      file sharing, otomatis download PDF
      lalu buka WhatsApp dengan informasi
      sertifikat.
    */

    const url=
      URL.createObjectURL(result.blob);


    const a=document.createElement('a');

    a.href=url;
    a.download=result.fileName;

    document.body.appendChild(a);
    a.click();
    a.remove();


    setTimeout(()=>{
      URL.revokeObjectURL(url);
    },5000);


    const text=
`🎓 Skill Passport Tramvior

Nama: ${U.nama}
Kompetensi: ${data.k.judul}
Jurusan: ${data.k.jur}
Nilai: ${data.score}
Hasil: ${data.result.label}
Kode: ${data.p.code}

Sertifikat Skill Passport dalam bentuk PDF telah diterbitkan oleh Tramvior.`;


    setTimeout(()=>{

      window.open(
        'https://wa.me/?text='+
        encodeURIComponent(text),
        '_blank',
        'noopener'
      );

    },700);


    toast(
      'PDF diunduh. WhatsApp dibuka untuk dibagikan.',
      'ok'
    );


  }catch(e){

    /*
      User membatalkan share sheet
      tidak dianggap sebagai error.
    */

    if(e&&e.name==='AbortError'){
      return;
    }

    console.error(e);

    toast(
      'Gagal membagikan PDF',
      'warn'
    );

  }finally{

    if(btn){

      btn.disabled=false;

      btn.innerHTML=
        `${ic('share','sm')} Bagikan PDF ke WhatsApp`;

    }

  }
}


/* =====================================================
   BIND SKILL PASSPORT
   ===================================================== */

function passB(id){

  if(!id)return;


  /* TERBITKAN */

  const ip=$('#issueP');

  if(ip){

    ip.onclick=()=>{

      const p=issuePassport(id);

      if(!p){

        toast(
          'Skill Passport belum dapat diterbitkan',
          'warn'
        );

        return;
      }


      toast(
        'Skill Passport berhasil diterbitkan',
        'ok'
      );


      confetti(90);
      sfx('ok');

      render();

    };

  }


  /* DOWNLOAD PDF */

  const download=$('#downloadP');

  if(download){

    download.onclick=()=>{
      downloadPassportPDF(id);
    };

  }


  /* BAGIKAN PDF */

  const wa=$('#waP');

  if(wa){

    wa.onclick=()=>{
      sharePassportPDF(id);
    };

  }


  /* SALIN INFORMASI */

  const sp=$('#shareP');

  if(sp){

    sp.onclick=async()=>{

      const data=passportData(id);

      if(!data||!data.p){

        toast(
          'Passport belum diterbitkan',
          'warn'
        );

        return;
      }


      const text=
`Skill Passport Tramvior

Nama: ${U.nama}
Sekolah: ${U.sekolah}
Kelas: ${U.kelas}

Kompetensi: ${data.k.judul}
Jurusan: ${data.k.jurusan||data.k.jur}
Nilai: ${data.score}
Hasil: ${data.result.label}

Kode Sertifikat: ${data.p.code}
Tanggal Terbit: ${fmtDate(data.p.date)}

Diterbitkan oleh Tramvior.`;


      try{

        await navigator.clipboard.writeText(text);

        toast(
          'Informasi Skill Passport disalin',
          'ok'
        );

      }catch(e){

        const ta=
          document.createElement('textarea');

        ta.value=text;

        ta.style.cssText=
          'position:fixed;opacity:0';

        document.body.appendChild(ta);

        ta.select();

        let ok=false;

        try{
          ok=document.execCommand('copy');
        }catch(_){}

        ta.remove();


        toast(
          ok
            ? 'Informasi Skill Passport disalin'
            : 'Gagal menyalin, salin manual',
          ok?'ok':'warn'
        );

      }

    };

  }

}

async function boot(){
  applyTheme();bindNet();
  if('serviceWorker' in navigator){
    try{await navigator.serviceWorker.register('sw.js');SWREADY=true}catch(e){SWREADY=false}
  }
  await seedDummyUsers();
  const seen=LS.get('tv_onb',0);
  const uid=getSession();
  const doStart=()=>{
    if(uid){const u=users().find(x=>x.id===uid);if(u){startSession(u,!!localStorage.getItem('tv_session'));return}}
    seen?showAuth('login'):showOnboard();
  };
  if(RM())doStart();else setTimeout(doStart,900);
}
