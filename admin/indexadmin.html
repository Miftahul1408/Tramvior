<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tramvior Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--navy:#0B2A6F;--blue:#2F6BFF;--sky:#E8F0FF;--orange:#FF8A1F;--yellow:#FFC93C;--bg:#F3F6FF;--card:#fff;--ink:#14213D;--muted:#5D6B8C;--line:#E2E8F6;--ok:#12B76A;--ok-bg:#E6F7EF;--bad:#E5484D;--bad-bg:#FDECEC}
[data-bs-theme=dark]{--bg:#0A1024;--card:#121B36;--ink:#EAF0FF;--muted:#9BA9CE;--line:#212F58;--sky:#1A2850;--bs-body-bg:#0A1024;--bs-body-color:#EAF0FF;--bs-border-color:#212F58}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
[hidden]{display:none!important}
a{text-decoration:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
#topbar{background:var(--card);border-bottom:1px solid var(--line);padding:10px 18px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between}
.card-t{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(11,42,111,.06),0 6px 18px rgba(11,42,111,.06)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;background:var(--sky);color:var(--blue);font-size:12px;font-weight:600;white-space:nowrap}
.pill-ok{background:var(--ok-bg);color:var(--ok)}.pill-bad{background:var(--bad-bg);color:var(--bad)}.pill-y{background:var(--yellow);color:#3A2A00}
.stat-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat-box b{font-size:22px;display:block}.stat-box small{color:var(--muted)}
table{font-size:13px}
.tbl-row{cursor:pointer}
.tbl-row:hover{background:var(--sky)}
.av{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.auth-box{max-width:380px;margin:80px auto;padding:28px;background:var(--card);border-radius:18px;border:1px solid var(--line)}
.banner-note{background:#FFF5D6;color:#8A6100;border-radius:12px;padding:10px 14px;font-size:12.5px;margin-bottom:14px}
[data-bs-theme=dark] .banner-note{background:#3A3010;color:#FFD466}
.modal-dialog{max-width:640px}
.log-tbl{max-height:420px;overflow:auto}
.sec-label{font-weight:600;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:14px 0 6px}
.form-select,.form-control{border-radius:10px}
.btn{border-radius:10px}
.tabs-t{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tab-b{border:0;background:none;padding:9px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;font-family:inherit}
.tab-b.active{color:var(--blue);border-bottom-color:var(--blue)}
.ans-txt{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;min-width:200px}
.ans-tbl td,.ans-tbl th{vertical-align:top}
.sel-ok{color:var(--ok)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toasts" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:999;display:grid;gap:8px"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-client.js"></script>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=t=>t?new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'—';
const fmtDateTime=t=>t?new Date(t).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function toast(msg,type='info'){
  const t=document.createElement('div');
  t.style.cssText='background:#0B2A6F;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2)';
  if(type==='bad')t.style.background='#E5484D';if(type==='ok')t.style.background='#12B76A';
  t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),2800);
}
/* =====================================================
   AKSES DATA — Supabase
   ===================================================== */
const db=window.tramviorSupabase;
let USERS=[],STATES={};
const getUsers=()=>USERS;
const getState=id=>STATES[id]||null;
async function loadDashboardData(){
  const [
    {data:profiles,error:profileError},
    {data:states,error:stateError},
    {data:entitlements,error:entitlementError}
  ]=await Promise.all([
    db.from('student_profiles').select('*').order('created_at',{ascending:false}),
    db.from('student_state').select('student_id,data'),
    db.from('premium_entitlements').select('student_id,expires_at')
  ]);
  if(profileError)throw profileError;
  if(stateError)throw stateError;
  if(entitlementError)throw entitlementError;
  STATES=Object.fromEntries(states.map(row=>[row.student_id,row.data]));
  const premiumExpiry=Object.fromEntries(entitlements.map(row=>[row.student_id,Date.parse(row.expires_at)]));
  USERS=await Promise.all(profiles.map(async row=>{
    const card=row.kartu_path?await db.storage.from('student-docs').createSignedUrl(row.kartu_path,3600):{data:null,error:null};
    if(card.error)throw card.error;
    return {
      id:row.id,email:row.email,nama:row.nama,jurusan:row.jurusan,kelas:row.kelas,
      sekolah:row.sekolah,kartuJurusan:card.data?.signedUrl||'',
      kartuVerified:row.kartu_verified,kartuTanggal:row.kartu_tanggal,
      premiumUntil:premiumExpiry[row.id]||0,
      createdAt:new Date(row.created_at).getTime()
    };
  }));
}
async function deleteStudentDocuments(studentId){
  const bucket=db.storage.from('student-docs');
  const {data,error}=await bucket.list(studentId,{limit:100});
  if(error)throw error;
  const paths=(data||[]).map(file=>`${studentId}/${file.name}`);
  if(paths.length){
    const {error:removeError}=await bucket.remove(paths);
    if(removeError)throw removeError;
  }
}

/* =====================================================
   AUTH ADMIN (terpisah dari akun siswa)
   ===================================================== */
let ADM=null;

function renderLogin(){
  $('#app').innerHTML=`<div class="auth-box">
   <div class="brand mb-3"><div class="logo">T</div>Tramvior <span class="muted" style="font-weight:500">Admin</span></div>
   <div class="banner-note">Masuk menggunakan akun admin Supabase. Akun harus memiliki role admin yang disetel di Supabase Auth.</div>
   <form id="fLogin">
    <div class="mb-3"><label class="form-label">Email admin</label><input id="aEmail" type="email" class="form-control"></div>
    <div class="mb-3"><label class="form-label">Kata sandi</label><input id="aPass" type="password" class="form-control"></div>
    <div class="text-danger small mb-2" id="aErr"></div>
    <button class="btn btn-primary w-100" type="submit">Masuk sebagai Admin</button>
   </form>
  </div>`;
  $('#fLogin').onsubmit=async e=>{
    e.preventDefault();
    const email=$('#aEmail').value.trim().toLowerCase(),pw=$('#aPass').value;
    const {data,error}=await db.auth.signInWithPassword({email,password:pw});
    if(error){$('#aErr').textContent='Gagal masuk: '+error.message;return}
    if(data.user.app_metadata?.role!=='admin'){
      await db.auth.signOut();
      $('#aErr').textContent='Akun ini belum memiliki role admin. Minta pemilik proyek mengaturnya di Supabase.';
      return;
    }
    ADM={id:data.user.id,email:data.user.email,nama:data.user.user_metadata?.nama||data.user.email};
    try{await loadDashboardData();renderDashboard()}
    catch(loadError){console.error('Gagal memuat data admin:',loadError);$('#aErr').textContent='Gagal memuat data server: '+loadError.message}
  };
}

/* =====================================================
   DASHBOARD
   ===================================================== */
let FILTER={q:'',jur:'',prem:''};
function premLabel(u){
  if(!u.premiumUntil||u.premiumUntil<=Date.now())return `<span class="pill">Gratis</span>`;
  const d=Math.ceil((u.premiumUntil-Date.now())/864e5);
  return `<span class="pill pill-y">Premium · ${d} hari</span>`;
}
function rowStats(u){
  const s=getState(u.id)||{};
  return {
    points:s.lifetime||0,streak:s.streak||0,
    mastered:Object.keys(s.mastered||{}).length,
    answers:(s.answerLog||[]).length,
    lastSync:s.lastSync||u.createdAt||0
  };
}
function renderDashboard(){
  const users=getUsers();
  const jurOpts=[...new Set(users.map(u=>u.jurusan))];
  $('#app').innerHTML=`
   <div id="topbar"><div class="brand"><div class="logo">T</div>Tramvior <span class="muted" style="font-weight:500">Admin</span></div>
    <div class="d-flex gap-2 align-items-center">
     <span class="small muted">${esc(ADM.nama||ADM.email)}</span>
     <button class="btn btn-outline-secondary btn-sm" id="btnTheme">Tema</button>
     <button class="btn btn-outline-secondary btn-sm" id="btnExportAll">Ekspor Siswa (CSV)</button>
     <button class="btn btn-outline-danger btn-sm" id="btnLogout">Keluar</button>
    </div></div>
   <div class="container-fluid p-3 p-md-4">
    <div class="banner-note">Data siswa dan progres dimuat langsung dari database Supabase.</div>
    <div class="row g-2 mb-3">
     <div class="col-6 col-md-3"><div class="stat-box"><b id="stTotal">0</b><small>Total akun</small></div></div>
     <div class="col-6 col-md-3"><div class="stat-box"><b id="stPremium">0</b><small>Premium aktif</small></div></div>
     <div class="col-6 col-md-3"><div class="stat-box"><b id="stVerif">0</b><small>Kartu terverifikasi</small></div></div>
     <div class="col-6 col-md-3"><div class="stat-box"><b id="stAnswers">0</b><small>Total jawaban tercatat</small></div></div>
    </div>
    <div class="tabs-t" role="tablist">
     <button class="tab-b active" id="tabSiswa" data-tab="siswa">Siswa</button>
     <button class="tab-b" id="tabJawab" data-tab="jawab">Bank Jawaban</button>
    </div>
    <div id="viewSiswa">
    <div class="card-t p-3 mb-3">
     <div class="row g-2">
      <div class="col-md-5"><input id="fQ" class="form-control" placeholder="Cari nama, email, atau sekolah..."></div>
      <div class="col-md-3"><select id="fJur" class="form-select"><option value="">Semua jurusan</option>${jurOpts.map(j=>`<option>${esc(j)}</option>`).join('')}</select></div>
      <div class="col-md-3"><select id="fPrem" class="form-select"><option value="">Semua status</option><option value="premium">Premium aktif</option><option value="gratis">Gratis</option></select></div>
      <div class="col-md-1"><button class="btn btn-outline-secondary w-100" id="btnRefresh" title="Muat ulang data">⟳</button></div>
     </div>
    </div>
    <div class="card-t p-0" style="overflow:auto">
     <table class="table table-hover mb-0 align-middle">
      <thead><tr><th>Siswa</th><th>Jurusan / Kelas</th><th>Sekolah</th><th>Kartu</th><th>Status</th><th>Poin</th><th>Kompetensi</th><th>Jawaban</th><th>Terakhir aktif</th></tr></thead>
      <tbody id="tblBody"></tbody>
     </table>
    </div>
    <p class="small muted mt-2" id="emptyNote" hidden>Belum ada akun siswa yang terdaftar di database.</p>
    </div>
    <div id="viewJawab" hidden>
     <div class="card-t p-3 mb-3">
      <div class="row g-2">
       <div class="col-md-3"><input id="aQ" class="form-control" placeholder="Cari soal, jawaban, atau nama..."></div>
       <div class="col-6 col-md-2"><select id="aSiswa" class="form-select"></select></div>
       <div class="col-6 col-md-2"><select id="aJur" class="form-select"></select></div>
       <div class="col-6 col-md-2"><select id="aMode" class="form-select"></select></div>
       <div class="col-6 col-md-1"><select id="aStatus" class="form-select"><option value="">Semua</option><option value="benar">Benar</option><option value="salah">Salah</option></select></div>
       <div class="col-12 col-md-2"><button class="btn btn-outline-secondary w-100" id="btnExportAns">Ekspor Jawaban (CSV)</button></div>
      </div>
     </div>
     <p class="small muted mb-2" id="aSummary"></p>
     <div class="card-t p-0" style="overflow:auto">
      <table class="table table-hover mb-0 ans-tbl">
       <thead><tr><th>Waktu</th><th>Siswa</th><th>Jurusan / Kompetensi</th><th>Mode</th><th>Soal</th><th>Jawaban dipilih</th><th>Jawaban benar</th><th>Status</th></tr></thead>
       <tbody id="ansBody"></tbody>
      </table>
     </div>
     <div class="text-center mt-3" id="aMoreWrap" hidden><button class="btn btn-outline-secondary btn-sm" id="aMore">Tampilkan lebih banyak</button></div>
    </div>
   </div>`;
  $('#btnLogout').onclick=async()=>{await db.auth.signOut();ADM=null;USERS=[];STATES={};renderLogin()};
  $('#btnTheme').onclick=()=>{const d=document.documentElement;d.setAttribute('data-bs-theme',d.getAttribute('data-bs-theme')==='dark'?'light':'dark')};
  $('#btnExportAll').onclick=exportAllCSV;
  $('#btnRefresh').onclick=async()=>{
    try{await loadDashboardData();paintTable();fillAnswerFilters();paintAnswers();toast('Data dimuat ulang','ok')}
    catch(error){console.error('Gagal memuat ulang data admin:',error);toast('Gagal memuat data: '+error.message,'bad')}
  };
  $$('.tab-b').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  $('#aQ').oninput=e=>{AFILTER.q=e.target.value.toLowerCase();ALIMIT=ALIMIT_STEP;paintAnswers()};
  $('#aSiswa').onchange=e=>{AFILTER.siswa=e.target.value;ALIMIT=ALIMIT_STEP;paintAnswers()};
  $('#aJur').onchange=e=>{AFILTER.jur=e.target.value;ALIMIT=ALIMIT_STEP;paintAnswers()};
  $('#aMode').onchange=e=>{AFILTER.mode=e.target.value;ALIMIT=ALIMIT_STEP;paintAnswers()};
  $('#aStatus').onchange=e=>{AFILTER.status=e.target.value;ALIMIT=ALIMIT_STEP;paintAnswers()};
  $('#aMore').onclick=()=>{ALIMIT+=ALIMIT_STEP;paintAnswers()};
  $('#btnExportAns').onclick=exportAnswersCSV;
  fillAnswerFilters();
  $('#fQ').oninput=e=>{FILTER.q=e.target.value.toLowerCase();paintTable()};
  $('#fJur').onchange=e=>{FILTER.jur=e.target.value;paintTable()};
  $('#fPrem').onchange=e=>{FILTER.prem=e.target.value;paintTable()};
  paintTable();
  setTab(ATAB);
}
function paintTable(){
  const users=getUsers();
  const body=$('#tblBody');if(!body)return;
  const rows=users.map(u=>{
    const stat=rowStats(u);
    const isPrem=u.premiumUntil>Date.now();
    return{u,stat,isPrem};
  });
  const totalPremium=rows.filter(r=>r.isPrem).length;
  const totalVerif=rows.filter(r=>r.u.kartuVerified).length;
  const totalAnswers=rows.reduce((n,r)=>n+r.stat.answers,0);
  $('#stTotal').textContent=users.length;
  $('#stPremium').textContent=totalPremium;
  $('#stVerif').textContent=totalVerif;
  $('#stAnswers').textContent=totalAnswers;
  $('#emptyNote').hidden=users.length>0;
  const filtered=rows.filter(({u,isPrem})=>{
    const hay=(u.nama+' '+u.email+' '+u.sekolah).toLowerCase();
    if(FILTER.q&&!hay.includes(FILTER.q))return false;
    if(FILTER.jur&&u.jurusan!==FILTER.jur)return false;
    if(FILTER.prem==='premium'&&!isPrem)return false;
    if(FILTER.prem==='gratis'&&isPrem)return false;
    return true;
  });
  body.innerHTML=filtered.map(({u,stat,isPrem})=>`
   <tr class="tbl-row" data-id="${u.id}">
    <td><div class="d-flex align-items-center gap-2"><div class="av">${initials(u.nama)}</div><div><b>${esc(u.nama)}</b><div class="small muted">${esc(u.email)}</div></div></div></td>
    <td>${esc(u.jurusan)}<div class="small muted">Kelas ${esc(u.kelas)}</div></td>
    <td>${esc(u.sekolah)}</td>
    <td>${u.kartuVerified?'<span class="pill pill-ok">Terverifikasi</span>':'<span class="pill pill-bad">Belum</span>'}</td>
    <td>${premLabel(u)}</td>
    <td>${(stat.points||0).toLocaleString('id-ID')}</td>
    <td>${stat.mastered}</td>
    <td>${stat.answers}</td>
    <td class="small">${stat.lastSync?fmtDateTime(stat.lastSync):'—'}</td>
   </tr>`).join('')||`<tr><td colspan="9" class="text-center text-muted py-4">Tidak ada hasil yang cocok.</td></tr>`;
  $$('.tbl-row',body).forEach(tr=>tr.onclick=()=>openDetail(tr.dataset.id));
}
/* =====================================================
   BANK JAWABAN
   ===================================================== */
let ATAB='siswa';
let AFILTER={q:'',siswa:'',jur:'',mode:'',status:''};
const ALIMIT_STEP=200;
let ALIMIT=ALIMIT_STEP;
function setTab(t){
  ATAB=t;
  const vs=$('#viewSiswa'),vj=$('#viewJawab');if(!vs||!vj)return;
  vs.hidden=t!=='siswa';vj.hidden=t!=='jawab';
  $$('.tab-b').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  if(t==='jawab')paintAnswers();
}
function allAnswers(){
  const out=[];
  getUsers().forEach(u=>{const st=getState(u.id)||{};(st.answerLog||[]).forEach(l=>out.push({u,l}))});
  return out.sort((a,b)=>(b.l.ts||0)-(a.l.ts||0));
}
function filteredAnswers(){
  return allAnswers().filter(({u,l})=>{
    if(AFILTER.siswa&&u.id!==AFILTER.siswa)return false;
    if(AFILTER.jur&&(l.jur||u.jurusan)!==AFILTER.jur)return false;
    if(AFILTER.mode&&l.mode!==AFILTER.mode)return false;
    if(AFILTER.status==='benar'&&!l.benar)return false;
    if(AFILTER.status==='salah'&&l.benar)return false;
    if(AFILTER.q){
      const hay=[u.nama,l.q,l.chosen,l.correctText,l.kid].join(' ').toLowerCase();
      if(!hay.includes(AFILTER.q))return false;
    }
    return true;
  });
}
function fillAnswerFilters(){
  const sel=$('#aSiswa');if(!sel)return;
  const users=getUsers(),all=allAnswers();
  const jurs=[...new Set([...users.map(u=>u.jurusan),...all.map(a=>a.l.jur)].filter(Boolean))];
  const modes=[...new Set(all.map(a=>a.l.mode).filter(Boolean))];
  sel.innerHTML='<option value="">Semua siswa</option>'+users.map(u=>`<option value="${esc(u.id)}">${esc(u.nama)}</option>`).join('');
  $('#aJur').innerHTML='<option value="">Semua jurusan</option>'+jurs.map(j=>`<option>${esc(j)}</option>`).join('');
  $('#aMode').innerHTML='<option value="">Semua mode</option>'+modes.map(m=>`<option>${esc(m)}</option>`).join('');
  // pulihkan pilihan; kalau opsinya sudah tidak ada, reset filter
  [['#aSiswa','siswa'],['#aJur','jur'],['#aMode','mode']].forEach(([id,k])=>{
    const el=$(id);el.value=AFILTER[k];if(el.value!==AFILTER[k])AFILTER[k]='';
  });
  $('#aStatus').value=AFILTER.status;
  $('#aQ').value=AFILTER.q;
}
function paintAnswers(){
  const body=$('#ansBody');if(!body)return;
  const rows=filteredAnswers();
  const benar=rows.filter(r=>r.l.benar).length;
  const shown=rows.slice(0,ALIMIT);
  $('#aSummary').textContent=rows.length
    ?`Menampilkan ${shown.length.toLocaleString('id-ID')} dari ${rows.length.toLocaleString('id-ID')} jawaban · Benar ${benar.toLocaleString('id-ID')} (${Math.round(benar/rows.length*100)}%) · Salah ${(rows.length-benar).toLocaleString('id-ID')}`
    :'';
  body.innerHTML=shown.map(({u,l})=>`
   <tr>
    <td class="small text-nowrap">${fmtDateTime(l.ts)}</td>
    <td><b>${esc(u.nama)}</b><div class="small muted">Kelas ${esc(u.kelas)}</div></td>
    <td class="small">${esc(l.jur||u.jurusan)}<div class="muted">${esc(l.kid||'')}</div></td>
    <td class="small">${esc(l.mode||'')}</td>
    <td class="ans-txt">${esc(l.q)}</td>
    <td class="ans-txt">${esc(l.chosen)}</td>
    <td class="ans-txt">${esc(l.correctText)}</td>
    <td>${l.benar?'<span class="pill pill-ok">Benar</span>':'<span class="pill pill-bad">Salah</span>'}</td>
   </tr>`).join('')||`<tr><td colspan="8" class="text-center text-muted py-4">${allAnswers().length?'Tidak ada jawaban yang cocok dengan filter.':'Belum ada jawaban soal yang tercatat.'}</td></tr>`;
  $('#aMoreWrap').hidden=rows.length<=ALIMIT;
}
function exportAnswersCSV(){
  const rows=filteredAnswers();
  if(!rows.length){toast('Tidak ada jawaban untuk diekspor','info');return}
  const head=['Waktu','Nama','Email','Kelas','Jurusan','Kompetensi','Mode','Soal','JawabanDipilih','JawabanBenar','Status'];
  const data=rows.map(({u,l})=>[new Date(l.ts).toLocaleString('id-ID'),u.nama,u.email,u.kelas,l.jur||u.jurusan,l.kid,l.mode,l.q,l.chosen,l.correctText,l.benar?'Benar':'Salah']);
  downloadCSV('tramvior-bank-jawaban.csv',[head,...data]);
  toast(`${rows.length} jawaban diekspor`,'ok');
}
function exportAllCSV(){
  const users=getUsers();
  const head=['Nama','Email','Jurusan','Kelas','Sekolah','KartuTerverifikasi','StatusPremium','PoinLifetime','Streak','KompetensiDikuasai','JumlahJawaban'];
  const rows=users.map(u=>{
    const s=getState(u.id)||{};const isPrem=u.premiumUntil>Date.now();
    return[u.nama,u.email,u.jurusan,u.kelas,u.sekolah,u.kartuVerified?'Ya':'Tidak',isPrem?'Premium':'Gratis',s.lifetime||0,s.streak||0,Object.keys(s.mastered||{}).length,(s.answerLog||[]).length];
  });
  downloadCSV('tramvior-siswa.csv',[head,...rows]);
}
function downloadCSV(filename,rows){
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href);
}

/* =====================================================
   DETAIL SISWA
   ===================================================== */
function modal(html){
  const r=$('#modalRoot');
  r.innerHTML=`<div class="modal fade show d-block" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">${html}</div></div></div><div class="modal-backdrop fade show"></div>`;
  const m=$('.modal',r);m.onmousedown=e=>{if(e.target===m)closeModal()};
  return $('.modal-content',r);
}
function closeModal(){$('#modalRoot').innerHTML=''}
function confirmBox(title,msg,okLabel,cb,okClass='btn-danger'){
  const m=modal(`<div class="p-4"><h5>${esc(title)}</h5><p class="muted small">${esc(msg)}</p><div class="d-flex gap-2"><button class="btn btn-outline-secondary flex-fill" id="cBatal">Batal</button><button class="btn ${okClass} flex-fill" id="cOk">${esc(okLabel)}</button></div></div>`);
  $('#cBatal',m).onclick=closeModal;$('#cOk',m).onclick=()=>{closeModal();cb()};
}
function openDetail(id){
  const users=getUsers();const u=users.find(x=>x.id===id);if(!u)return;
  const s=getState(id)||{};
  const isPrem=u.premiumUntil>Date.now();
  const mastered=Object.keys(s.mastered||{});
  const badges=Object.keys(s.badges||{});
  const log=(s.answerLog||[]).slice().reverse();
  const m=modal(`<div class="p-4">
   <div class="d-flex align-items-center gap-3 mb-3">
    <div class="av" style="width:52px;height:52px;font-size:16px">${initials(u.nama)}</div>
    <div class="flex-fill"><h5 class="mb-0">${esc(u.nama)}</h5><p class="small muted mb-0">${esc(u.email)} · ${esc(u.jurusan)} · Kelas ${esc(u.kelas)}</p><p class="small muted mb-0">${esc(u.sekolah)}</p></div>
    <button class="btn-close" id="mClose"></button></div>

   ${u.kartuJurusan?`<div class="sec-label">Kartu Identitas Jurusan</div><img src="${u.kartuJurusan}" style="max-width:100%;max-height:200px;border-radius:12px;border:1px solid var(--line)">`:'<p class="small muted">Belum ada foto kartu diunggah.</p>'}
   <div class="d-flex gap-2 mt-2">
    <button class="btn btn-sm ${u.kartuVerified?'btn-outline-secondary':'btn-success'}" id="btnVerify">${u.kartuVerified?'Batalkan verifikasi':'Verifikasi kartu'}</button>
   </div>

   <div class="sec-label">Status Akun</div>
   <div class="row g-2">
    <div class="col-6 col-md-3"><div class="stat-box"><b>${(s.lifetime||0).toLocaleString('id-ID')}</b><small>Poin</small></div></div>
    <div class="col-6 col-md-3"><div class="stat-box"><b>${s.streak||0}</b><small>Streak</small></div></div>
    <div class="col-6 col-md-3"><div class="stat-box"><b>${mastered.length}</b><small>Kompetensi</small></div></div>
    <div class="col-6 col-md-3"><div class="stat-box"><b>${badges.length}</b><small>Lencana</small></div></div>
   </div>
   <p class="small mt-2 mb-0">${isPrem?`<span class="pill pill-y">Premium aktif · ${Math.ceil((u.premiumUntil-Date.now())/864e5)} hari lagi</span> (berlaku sampai ${fmtDate(u.premiumUntil)})`:`<span class="pill">Akun Gratis</span>`}</p>
   <p class="small muted mt-2 mb-2">Cocokkan pembayaran di WhatsApp dengan email akun ini sebelum mengaktifkan Premium.</p>
   <button class="btn btn-sm btn-success" id="btnActivate">Aktifkan / perpanjang 30 hari</button>
   ${isPrem?`<button class="btn btn-sm btn-outline-danger mt-2" id="btnRevoke">Cabut Premium</button>`:''}

   <div class="sec-label d-flex justify-content-between align-items-center">Log Jawaban Soal (${log.length})<button class="btn btn-sm btn-outline-secondary" id="btnExportLog">Ekspor CSV</button></div>
   <div class="log-tbl">
   ${log.length?`<table class="table table-sm"><thead><tr><th>Waktu</th><th>Mode</th><th>Soal</th><th>Jawaban</th><th>Status</th></tr></thead><tbody>
    ${log.slice(0,100).map(l=>`<tr><td class="small">${fmtDateTime(l.ts)}</td><td class="small">${esc(l.mode)}</td><td class="small ans-txt">${esc(l.q||'')}</td><td class="small ans-txt">${esc(l.chosen||'')}${l.benar?'':`<div class="sel-ok mt-1">Benar: ${esc(l.correctText||'')}</div>`}</td><td>${l.benar?'<span class="pill pill-ok">Benar</span>':'<span class="pill pill-bad">Salah</span>'}</td></tr>`).join('')}
   </tbody></table>${log.length>100?`<p class="small muted">Menampilkan 100 terbaru dari ${log.length}. Ekspor CSV untuk melihat semua.</p>`:''}`
   :'<p class="small muted">Belum ada jawaban soal yang tercatat untuk siswa ini.</p>'}
   </div>

   <div class="sec-label">Riwayat Penukaran Kuota</div>
   ${(s.redeem||[]).length?`<ul class="small mb-0">${s.redeem.slice(0,10).map(r=>`<li>${fmtDate(r.t)} — ${r.mb>=1024?(r.mb/1024)+' GB':r.mb+' MB'} (${esc(r.op)})</li>`).join('')}</ul>`:'<p class="small muted">Belum ada penukaran.</p>'}

   <div class="sec-label text-danger">Zona Berbahaya</div>
   <button class="btn btn-sm btn-outline-danger" id="btnDelete">Hapus akun siswa ini</button>
  </div>`);
  $('#mClose',m).onclick=closeModal;
  $('#btnVerify',m).onclick=async()=>{
    const verified=!u.kartuVerified;
    const {error}=await db.rpc('admin_set_card_verification',{p_student_id:u.id,p_verified:verified});
    if(error){console.error('Gagal mengubah verifikasi kartu:',error);toast('Verifikasi gagal: '+error.message,'bad');return}
    u.kartuVerified=verified;toast(verified?'Kartu diverifikasi':'Verifikasi dibatalkan','ok');closeModal();paintTable();
  };
  $('#btnActivate',m).onclick=()=>confirmBox('Aktifkan Premium',`Pastikan pembayaran ${esc(u.nama)} (${esc(u.email)}) sudah diterima dan cocok dengan akun ini.`,'Aktifkan 30 hari',async()=>{
    const {data,error}=await db.rpc('admin_set_premium',{p_student_id:u.id,p_duration_days:30,p_revoke:false});
    if(error){console.error('Gagal mengaktifkan Premium:',error);toast('Premium gagal diaktifkan: '+error.message,'bad');return}
    const expiresAt=Date.parse(data);
    if(!Number.isFinite(expiresAt)){toast('Premium tersimpan, tetapi tanggal berakhir tidak terbaca. Muat ulang data.','bad');return}
    u.premiumUntil=expiresAt;toast('Premium aktif sampai '+fmtDate(expiresAt),'ok');closeModal();paintTable();
  },'btn-success');
  const br=$('#btnRevoke',m);if(br)br.onclick=()=>confirmBox('Cabut Premium',`Masa Premium ${esc(u.nama)} akan diakhiri sekarang juga.`,'Cabut Premium',async()=>{
    const {data,error}=await db.rpc('admin_set_premium',{p_student_id:u.id,p_duration_days:0,p_revoke:true});
    if(error){console.error('Gagal mencabut Premium:',error);toast('Premium gagal dicabut: '+error.message,'bad');return}
    const expiresAt=Date.parse(data);
    if(!Number.isFinite(expiresAt)){toast('Premium dicabut, tetapi tanggal status tidak terbaca. Muat ulang data.','bad');return}
    u.premiumUntil=expiresAt;toast('Premium dicabut','ok');closeModal();paintTable();
  });
  $('#btnExportLog',m).onclick=()=>{
    const head=['Waktu','Mode','Jurusan','Kompetensi','Soal','JawabanDipilih','JawabanBenar','Status'];
    const rows=log.map(l=>[new Date(l.ts).toLocaleString('id-ID'),l.mode,l.jur,l.kid,l.q,l.chosen,l.correctText,l.benar?'Benar':'Salah']);
    downloadCSV(`jawaban-${u.nama.replace(/\s+/g,'-')}.csv`,[head,...rows]);
  };
  $('#btnDelete',m).onclick=()=>confirmBox('Hapus Akun Siswa',`Akun ${esc(u.nama)} beserta seluruh progres belajarnya akan dihapus permanen dari server. Tindakan ini tidak bisa dibatalkan.`,'Hapus permanen',async()=>{
    const {error}=await db.rpc('admin_delete_student',{p_student_id:u.id});
    if(error){console.error('Gagal menghapus akun siswa:',error);toast('Akun gagal dihapus: '+error.message,'bad');return}
    USERS=USERS.filter(x=>x.id!==u.id);delete STATES[u.id];
    try{await deleteStudentDocuments(u.id)}
    catch(error){console.error('Akun terhapus tetapi foto siswa belum berhasil dihapus:',error);toast('Akun terhapus, tetapi penghapusan foto gagal: '+error.message,'bad');paintTable();return}
    toast('Akun siswa dihapus','ok');paintTable();
  });
}

/* =====================================================
   BOOT
   ===================================================== */
(async function boot(){
  const {data,error}=await db.auth.getSession();
  if(error){console.error('Gagal memeriksa sesi admin:',error);toast('Gagal memeriksa sesi: '+error.message,'bad');renderLogin();return}
  if(data.session&&data.session.user.app_metadata?.role==='admin'){
    ADM={id:data.session.user.id,email:data.session.user.email,nama:data.session.user.user_metadata?.nama||data.session.user.email};
    try{await loadDashboardData();renderDashboard();return}
    catch(loadError){console.error('Gagal memuat dashboard:',loadError);toast('Gagal memuat dashboard: '+loadError.message,'bad')}
  }
  renderLogin();
})();
</script>
